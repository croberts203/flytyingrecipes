        region_code:region?.region_code||null, region_name:region?.region_name||null, country_code:region?.country_code||null,
        species_id:spId, species_other: v==="other" ? $("#cOther",s).value.trim()||null : null, species_confirmed: !!(spId || v==="other"),
        ai_guess:ai.guess||null, ai_confidence:ai.conf||null, length_in:$("#cLen",s).value||null, weight_lb:$("#cWt",s).value||null,
        fly_id:$("#cFly",s).value?+$("#cFly",s).value:null, kept:$("#cKept",s).checked, photo_path, notes:$("#cNotes",s).value.trim()||null };
      const r = isNew ? await sb.from("catches").insert(row) : await sb.from("catches").update(row).eq("id",c.id);
      if(r.error) throw r.error;
      s.remove(); S.catches=null; toast("Catch saved"); renderLog();
    }catch(err){ toast(err.message||"Save failed",4000); btn.disabled=false; btn.textContent="Save"; }
  };
}
function openCatch(c){
  const sp=speciesById(c.species_id), fly=S.flies?.find(f=>f.id===c.fly_id);
  const name = sp?.common_name || c.species_other || "Unknown species";
  const s=sheet(`${c.photo_url?`<img class="hero" src="${c.photo_url}">`:""}
    <h2>${esc(name)}</h2><p class="small muted">${fmtDate(c.caught_at)}${c.location_name?` · ${esc(c.location_name)}`:""}</p>
    <div class="card"><div class="small">${c.length_in?`<b>${c.length_in}"</b> · `:""}${c.weight_lb?`<b>${c.weight_lb} lb</b> · `:""}${c.kept?"Kept":"Released"}${fly?` · on <a href="#" id="toFly">${esc(fly.name)}</a>`:""}</div>
      ${c.lat?`<div class="small muted" style="margin-top:4px">📍 ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)} · <a href="https://maps.google.com/?q=${c.lat},${c.lng}" target="_blank" rel="noopener">open map</a></div>`:""}
      ${c.ai_guess?`<div class="small muted" style="margin-top:4px">AI suggested: ${esc(c.ai_guess)} (${esc(c.ai_confidence||"")})</div>`:""}
      ${c.notes?`<p class="small" style="margin:8px 0 0">${esc(c.notes)}</p>`:""}</div>
    ${rulesLinks(c)}
    ${sp?regsHtml(sp.id, c):""}
    <div class="card"><h3>Get a second opinion</h3><p class="small muted" style="margin:6px 0 8px">Post this catch to iNaturalist and their community will help confirm the species. Save the photo first, then upload it there.</p>
      <div class="row wrap">${c.photo_url?`<a class="btn sm alt" href="${c.photo_url}" target="_blank" rel="noopener" download>Save photo</a>`:""}<a class="btn sm" href="https://www.inaturalist.org/observations/upload" target="_blank" rel="noopener" id="inat">Open iNaturalist ↗</a></div></div>
    <div class="row"><button class="btn grow" id="ed">Edit</button><button class="btn alt grow" id="cl">Close</button></div>`);
  $("#ed",s).onclick=()=>{ s.remove(); editCatch(c); };
  $("#cl",s).onclick=()=>s.remove();
  $("#inat",s).onclick=()=>{ const t=`${sp?.inat_taxon_name||name}${c.lat?` @ ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`:""}`; navigator.clipboard?.writeText(t).then(()=>toast("Species & location copied — paste into iNaturalist")).catch(()=>{}); };
  if($("#toFly",s)) $("#toFly",s).onclick=e=>{ e.preventDefault(); s.remove(); setTab("flies"); openFly(fly.id); };
}

/* ================= SPECIES / REGS ================= */
async function renderSpecies(){
  if(!S.flies) await loadFlies();
  const groups={}; S.species.forEach(sp=>(groups[sp.group_name||"Other"] ||= []).push(sp));
  const nr=S.nearRegion, notFL = nr && nr.region_code && nr.region_code!=="US-FL";
  view.innerHTML = `${nr?rulesLinks(nr,"Fishing rules where you are"):`<div class="card rules"><div class="row"><div class="grow"><b>Fishing rules near me</b><div class="small muted">Use your location to open your state's official fishing rules.</div></div><button class="btn sm" id="nrGo">📍 Find</button></div></div>`}
    <div class="card" style="background:#fbf3e2"><p class="small" style="margin:0">${notFL?`The limits below are Florida's (FWC). You're in ${esc(nr.region_name)}, so ${FBRules.links(nr).length?"use the links above":"check your state's fish and wildlife agency"} for the rules that apply to you.`:`Northeast Florida summary of FWC recreational rules, checked when the app was built. Rules change often — always confirm on the official FWC page before keeping a fish.`}</p></div>
    ${Object.entries(groups).map(([g,list])=>`<h3 style="margin:16px 0 8px">${esc(g)}</h3>${list.map(sp=>{ const r=(S.regs[sp.id]||[])[0]; const n=S.flies.filter(f=>(f.fly_species||[]).some(x=>x.species_id===sp.id)).length;
      return `<div class="card" data-sp="${sp.id}" style="cursor:pointer"><div class="row"><div class="grow"><h3>${esc(sp.common_name)}</h3><div class="small muted"><i>${esc(sp.scientific_name||"")}</i></div></div><span class="small muted">${n} flies ›</span></div>
      ${r?`<div class="small" style="margin-top:6px">${[r.size_limit,r.bag_limit,r.season].filter(Boolean).map(esc).join(" · ") || "No specific limits on file"}</div>`:""}</div>`; }).join("")}`).join("")}`;
  if($("#nrGo")) $("#nrGo").onclick=openNearbyRules;
  view.querySelectorAll("[data-sp]").forEach(el=>el.onclick=()=>{ const sp=speciesById(+el.dataset.sp);
    const s=sheet(`<h2>${esc(sp.common_name)}</h2><p class="small muted"><i>${esc(sp.scientific_name||"")}</i></p>${sp.id_tips?`<p class="small"><b>How to ID:</b> ${esc(sp.id_tips)}</p>`:""}${regsHtml(sp.id)}
      ${forecastLink(sp)}
      <button class="btn" style="width:100%" id="sf">See flies for ${esc(sp.common_name.replace(/ \(.+\)/,""))}</button>`);
    $("#sf",s).onclick=()=>{ s.remove(); S.flyFilter={...S.flyFilter, species:String(sp.id)}; setTab("flies"); }; });
}

/* ---------------- boot ---------------- */
sb.auth.onAuthStateChange((evt)=>{ if(evt==="SIGNED_IN"||evt==="SIGNED_OUT") afterAuth(); if(evt==="PASSWORD_RECOVERY"){ const p=prompt("Enter a new password"); if(p) sb.auth.updateUser({password:p}).then(()=>toast("Password updated")); } });
(async()=>{
  view.innerHTML=`<div class="empty"><span class="spinner"></span></div>`;
  await Promise.all([refreshUser(), loadBase()]);
  await loadInventory();
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("/sw.js").catch(()=>{});
  const wantDelete = location.hash==="#delete-account";
  if(wantDelete){ history.replaceState(null,"",location.pathname); if(S.user) openAccount(); else { S.pendingAccount=true; openAuth(); } }
  if(location.hash==="#subscribe"){ history.replaceState(null,"",location.pathname); openSubscribe(); }
  if(location.hash==="#rules"){ history.replaceState(null,"",location.pathname); openNearbyRules(); }
  if(location.hash==="#phonescan"){ history.replaceState(null,"",location.pathname); if(S.user) setTimeout(()=>openScanner(), 300); else { toast("Sign in, then tap 📷 Scan barcode"); openAuth(); } }
  const wantTie = location.hash.startsWith("#tie="), hfly = location.hash.match(/^#(?:fly|tie)=(\d+)/), hfish = (location.hash.match(/^#fish=([a-z0-9-]+)/)||[])[1] || new URLSearchParams(location.search).get("fish");
  if(hfish){ const sp=S.species.find(x=>spSlug(x.common_name)===hfish || FC_SP[x.id]===hfish); if(sp){ S.flyFilter={...S.flyFilter, species:String(sp.id)}; S.tab="flies"; } history.replaceState(null,"",location.pathname); }
  const wantNew = location.hash==="#new";
  if(wantNew){ history.replaceState(null,"",location.pathname); S.tab="flies"; document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="flies")); }
  await render();
  if(wantNew){ if(S.user) editFly(); else { S.pendingNew=true; openAuth(); } }
  if(hfly){ if(!S.flies) await loadFlies(); const f=S.flies.find(x=>x.id===+hfly[1]); if(f){ openFly(f.id); if(wantTie) tieMode(f); } }
  let seen=true; try{ seen=!!localStorage.getItem("fb_welcomed"); }catch{}
  if(!seen && !DEMO && !hfly && !wantNew && !S.user && !document.querySelector(".sheet")) welcome();
})();
</script>
