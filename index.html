<!DOCTYPE html>
<html lang="en">

<style>
:root{
  /* matches flytyingrecipes.org: navy, slate, sea and cream */
  --navy:#182241; --slate:#536c7c; --sea:#7b949c; --cream:#fff5d9;
  --ink:#182241; --muted:#5b6b78; --paper:#f7f3e8; --card:#ffffff; --line:#e3ddcc;
  --teal:#182241; --teal2:#536c7c; --brass:#c9a24a; --red:#b4452f; --green:#2f7a4a; --amber:#b9852f;
  --r:18px; --shadow:0 1px 2px rgba(24,34,65,.05),0 6px 18px rgba(24,34,65,.07);
  --head:Manrope,system-ui,sans-serif; --body:"Nunito Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15.5px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--head);font-weight:700;margin:0;letter-spacing:-.015em;color:var(--navy)}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
a{color:var(--teal2)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--cream);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:1.3rem;flex:1;color:var(--cream);font-weight:800}
header.top .sub{font:700 .7rem var(--body);opacity:.75;letter-spacing:.08em;text-transform:uppercase}
header.top button{background:var(--cream);border:0;color:var(--slate);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:700}
main{padding:14px 14px calc(150px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--navy);font-weight:700}
nav.tabs button.on svg{stroke:var(--slate)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:.82rem}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--slate);color:#fff;font-weight:700;cursor:pointer;letter-spacing:.01em}
.btn.alt{background:var(--cream);color:var(--slate)}
.btn.brass{background:var(--navy);color:var(--cream)}
.btn.ghost{background:none;color:var(--teal2);padding:6px 8px}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:999px}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;border-radius:999px;padding:14px 18px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],input[type=url],input[type=tel],input[type=datetime-local],input:not([type]),select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px}
input[type=search]{border-radius:999px;padding-left:18px}
input[type=file]{width:100%;font:inherit;font-size:.9rem;color:var(--muted)}
input[type=file]::file-selector-button{font:700 .9rem var(--body);border:0;border-radius:999px;background:var(--cream);color:var(--slate);padding:9px 16px;margin-right:10px;cursor:pointer}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:10px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--cream);font-weight:700}
.tag{display:inline-block;font-size:.74rem;font-weight:600;background:var(--cream);color:var(--slate);border-radius:999px;padding:2px 9px;margin:2px 4px 2px 0}
.tag.salt{background:#dde7ea;color:#3d5563} .tag.fresh{background:#e3ecd9;color:#3f5a37} .tag.both{background:#e7e4f0;color:#4a4a6a}
.flycard{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--cream) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--slate)}
.thumb svg{width:30px;height:30px}
.have{color:var(--green)} .maybe{color:var(--amber)} .need{color:var(--red)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.have{background:var(--green)} .dot.maybe{background:var(--amber)} .dot.need{background:var(--red)}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 40px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--slate);color:#fff;font:700 .85rem/28px var(--body);text-align:center}
ol.steps img{width:100%;border-radius:10px;margin-top:8px}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);margin-bottom:12px;background:#e9e3d4}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:1.1rem;font-weight:600}
.qty b{min-width:30px;text-align:center}
.low{background:#fbeee2;border-color:#f0d3b8}
.buy{display:inline-block;margin-top:4px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:.8rem;font-weight:600;color:inherit;text-decoration:none;white-space:nowrap}
.buy:hover{border-color:var(--green)}
.pendcard{background:#eef5ee;border-color:#cfe3cf}
.fclink{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin:10px 0 6px;color:var(--ink);text-decoration:none;box-shadow:var(--shadow)}
.fclink .fcico{width:46px;height:30px;flex:none;color:var(--slate);--fish-eye:#fff}.fclink .fcico svg{width:100%;height:100%}
.fclink .small{color:var(--muted)}.fclink .fcgo{margin-left:auto;font-size:1.6rem;color:var(--sea);line-height:1}
.urow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ucheck{display:flex;gap:10px;align-items:flex-start;margin:0;color:var(--ink);font-size:.95rem;flex:1 1 220px}.ucheck input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--navy)}
.uper{display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap}.uper input{width:74px;padding:6px 8px;border-radius:10px}
.tie{position:fixed;inset:0;z-index:2000;background:var(--paper);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.tie-top{background:var(--navy);color:#fff;padding:12px 16px 10px;position:relative}
.tie-name{font:800 1.05rem var(--head);padding-right:40px}.tie-x{position:absolute;right:10px;top:8px;background:none;border:0;color:#fff;font-size:1.4rem;padding:6px 10px;cursor:pointer}
.tie-bar{height:5px;background:rgba(255,255,255,.18);border-radius:5px;margin-top:10px;overflow:hidden}.tie-bar i{display:block;height:100%;background:var(--cream);border-radius:5px;transition:width .25s}
.tie-body{flex:1;overflow:auto;padding:22px 20px;max-width:720px;width:100%;margin:0 auto;box-sizing:border-box}
.tie-k{font:800 .8rem var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-bottom:8px}
.tie-body h2{font:800 1.6rem var(--head);margin:0 0 12px}.tie-txt{font-size:1.45rem;line-height:1.45;margin:0 0 16px}.tie-sub{font-size:1.1rem;text-align:center;color:var(--muted)}
.tie-img{width:100%;max-height:42vh;object-fit:contain;border-radius:16px;background:#111;margin-bottom:14px}
.tie-ref{margin:0 0 16px;display:flex;align-items:center;gap:12px}.tie-ref img{width:46%;max-width:240px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#111}.tie-ref figcaption{font-size:.85rem;color:var(--muted)}
.tie-mats{list-style:none;padding:0;margin:0}.tie-mats li{padding:10px 0;border-bottom:1px solid var(--line);font-size:1.1rem}.tie-mats label{display:flex;gap:12px;align-items:flex-start;color:var(--ink);font-size:inherit;margin:0}.tie-mats input{width:22px;height:22px;margin-top:3px;flex:none;accent-color:var(--navy)}
.tie-done{width:96px;height:96px;margin:30px auto 10px;color:var(--slate)}.tie-done svg{width:100%;height:100%}.tie-body h2:has(+.tie-sub){text-align:center}
.tie-nav{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}.tie-nav .btn{flex:1;font-size:1.05rem;padding:14px}
.welcome{position:fixed;inset:0;z-index:2001;background:rgba(24,34,65,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.wcard{background:var(--paper);border-radius:28px;padding:28px 24px 22px;max-width:380px;width:100%;text-align:center;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.wskip{position:absolute;right:14px;top:12px;background:none;border:0;color:var(--muted);font:700 .9rem var(--body);cursor:pointer;padding:6px}
.wico{width:110px;height:110px;border-radius:50%;background:var(--navy);color:var(--cream);margin:6px auto 16px;display:flex;align-items:center;justify-content:center}.wico svg{width:56px;height:56px}.wico .wfish svg{width:78px;height:50px}.wico .wfish{--fish-eye:var(--navy);display:flex}
.wcard h2{font:800 1.5rem var(--head);margin:0 0 8px}.wcard p{color:var(--muted);margin:0 0 18px;font-size:1rem}
.wdots{display:flex;gap:7px;justify-content:center;margin-bottom:16px}.wdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.wdots i.on{background:var(--navy);width:22px;border-radius:5px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;z-index:80;font-size:.9rem;max-width:90vw;text-align:center}
#scanner{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}.stgrid div{background:var(--paper,#f7f2e7);border-radius:10px;padding:8px;text-align:center}.stgrid b{display:block;font-size:1.3rem}.stgrid span{font-size:.72rem;color:var(--muted,#6b7785)}
.stbars{display:flex;align-items:flex-end;gap:2px;height:70px;padding:4px 0}.stbars div{flex:1;height:100%;position:relative;display:flex;align-items:flex-end}.stbars i{display:block;width:100%;background:var(--navy,#14202e);border-radius:3px 3px 0 0;opacity:.75}.stbars b{position:absolute;bottom:0;left:0;right:0;background:var(--brass,#c9973b);border-radius:3px 3px 0 0}
.sttab{width:100%;border-collapse:collapse;font-size:.85rem}.sttab th{font-weight:600;text-align:right;font-size:.72rem;color:var(--muted,#6b7785)}.sttab td{padding:6px 4px;border-top:1px solid var(--line,#e5dfd0);text-align:right}.sttab td:first-child,.sttab th:first-child{text-align:left}
.stcode{gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line,#e5dfd0);flex-wrap:wrap}
.deskpair{display:flex;gap:14px;align-items:flex-start}.qrbox{width:150px;min-width:150px;height:150px;background:#fff;border-radius:10px;padding:6px;display:grid;place-items:center}.qrbox svg{width:100%;height:100%}
.sheet.desk>div{max-width:720px}.deskit{padding:10px 12px;margin-bottom:8px}.deskit.done{opacity:.8}.deskit.new{border-left:4px solid var(--brass)}.deskit .row{gap:6px;margin-top:6px;align-items:center}.deskit input,.deskit select{margin:0}
@media (max-width:640px){.desk-only{display:none}}
#scanner video{flex:1;width:100%;object-fit:cover}
#scanner .frame{position:absolute;left:10%;right:10%;top:35%;height:22%;border:3px solid var(--brass);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#scanner .bar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
#scanner .modes{display:flex;gap:6px;margin-bottom:10px}
#scanner .modes .chip{background:rgba(255,255,255,.15);color:#fff;border-color:transparent}
#scanner .modes .chip.on{background:var(--brass)}
#scanner.native{background:var(--navy)}
#scanner.native .bar{top:auto;background:none;padding-top:24px}
.in-app .hide-in-app{display:none!important}
#map{height:360px;border-radius:var(--r);border:1px solid var(--line)}
.reg dt{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.reg dd{margin:2px 0 0}
.ai{border-left:4px solid var(--brass)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.seg{display:flex;background:#ece6d6;border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.edit-row{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.photo-pick{display:flex;align-items:center;gap:10px}
.photo-pick input[type=file]{flex:1;min-width:0;max-width:100%}
.photo-pick .btn{flex:none}
.photo-pick img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#e9e3d4}
.yt{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;margin-top:8px}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt.hero{margin:0 0 12px;border-radius:var(--r)}
.yt-prev{display:flex;align-items:center;gap:10px;margin-top:6px}
.yt-prev img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}
.hero.fit{object-fit:contain;background:#141a1c}
.matthumb{width:48px;height:48px;flex:none;border-radius:8px;overflow:hidden;background:#e9e3d4;display:grid;place-items:center;color:var(--slate)}
.matthumb{position:relative}
.matthumb img{width:100%;height:100%;object-fit:cover}
.matthumb .addph{position:absolute;right:-2px;bottom:-2px;font-size:12px;background:#fff;border-radius:50%;width:18px;height:18px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.benchph{display:flex;gap:12px;align-items:center;margin:10px 0}
.benchph img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:#e9e3d4}
.matthumb svg{width:24px;height:24px}
.matthumb.sm{width:34px;height:34px;border-radius:6px}
.matthumb.sm svg{width:18px;height:18px}
.credit{margin:-6px 0 10px}
.credit a{color:inherit}
.favbtn{position:absolute;top:6px;right:6px;z-index:2;width:38px;height:38px;border-radius:999px;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18);padding:0}
.favbtn svg{width:20px;height:20px;fill:none;stroke:#b3263a;stroke-width:2}.favbtn.on svg{fill:#d7263d;stroke:#d7263d}
.favbtn.big{position:static;width:auto;height:36px;padding:0 12px;gap:6px;display:inline-flex;align-items:center;margin-right:8px;font:700 .85rem/1 var(--body);color:#b3263a;border:1px solid #f0c9cf;box-shadow:none}
.favbtn.on.big{background:#fde8eb}
.media-tag{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font:700 .7rem/1 var(--body);padding:4px 7px;border-radius:999px}
.thumb{position:relative}
.req{color:#b3412e}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.hide{display:none!important}
.hero-link{position:relative;display:block}.hero-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none}
.card.credit{border-left:4px solid var(--sea)}
.card.rules{border-left:4px solid var(--sea)}
body:has(.sheet) #ft-btn, body:has(#scanner) #ft-btn{display:none!important} /* keep the chat bubble off open forms */.card.rules .row a.btn{text-decoration:none}
.card.credit a.btn{display:block;color:#fff;text-decoration:none}

/* Flies tab banner, bigger recipe cards, friendlier empty states */
.banner{position:relative;margin:-14px -14px 14px;min-height:170px;padding:22px 20px 20px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--cream);background:var(--navy) url('https://images.squarespace-cdn.com/content/v1/6b010ce7d7a3185c477334d7/1795232922906-OFSVWV5SDN5JWU0NTN5A/unsplash-image-0Rl_Rxh6Jq8.jpg?format=1000w') center/cover no-repeat}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,34,65,.15),rgba(24,34,65,.82))}
.banner>*{position:relative}

.banner .btn{align-self:flex-start;margin-top:12px;background:var(--cream);color:var(--slate)}

.fishpick{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 10px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fishpick::-webkit-scrollbar{display:none}
.thumb.fishthumb{--fish-eye:var(--cream);color:var(--slate)}

// YouTube links: accept watch, youtu.be, shorts, embed and live URLs, with an optional start time (t=90 or t=1m30s).
function ytParse(u){
  try{
    const url = new URL(String(u||"").trim());
    const host = url.hostname.replace(/^(www\.|m\.|music\.)/,"");
    let id = null;
    if(host==="youtu.be") id = url.pathname.slice(1).split("/")[0];
    else if(/^youtube(-nocookie)?\.com$/.test(host)){
      if(url.pathname==="/watch") id = url.searchParams.get("v");
      else { const m = url.pathname.match(/^\/(shorts|embed|live|v)\/([^/?#]+)/); if(m) id = m[2]; }
    }
    if(!id || !/^[\w-]{11}$/.test(id)) return null;
    const t = url.searchParams.get("t") || url.searchParams.get("start") || (url.hash.match(/t=([\dhms]+)/)||[])[1] || "";
    let start = 0;
    if(/^\d+$/.test(t)) start = +t;
    else { const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/); if(m) start = (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0); }
    return { id, start };
  }catch{ return null; }
}

async function resizeImage(file, max=1600, quality=.85){
  const img = await new Promise((res, rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const k = Math.min(1, max/Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", quality));
  const dataUrl = c.toDataURL("image/jpeg", quality);
  return { blob, dataUrl };
}
async function uploadPhoto(bucket, file, max=1600){

  const path = `${S.user.id}/${uid()}.jpg`;

  if(error) throw error;
  return path;
}

/* ---------------- material matching ---------------- */
const STOP = new Set("with plus and the for or optional small medium large size sizes color colour e.g. similar sparse white black tan olive pink red few strands strand pair pairs brown grey gray green yellow orange blue purple chartreuse natural dyed dark light fine thin thick long short turns tied wound bunch tuft tips fibres fibers optional".split(" "));

const SUBBABLE = new Set(["hook","thread","glue","wire","flash","tool","other"]);
const words = s => (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=4 && !STOP.has(w));
function matStatus(fm){
  if(!S.user || !S.inventory.length) return null;
  const stocked = S.inventory.filter(i => Number(i.quantity) > 0);
  if(fm.material_id && stocked.some(i=>i.material_id===fm.material_id)) return "have";
  const w = words(fm.material_text);
  const hit = stocked.find(i => { const iw = words(`${i.material.name} ${i.material.brand||""}`); return iw.some(x=>w.includes(x)); });
  if(hit) return "have";
  if(fm.category && stocked.some(i => i.material.category === fm.category)) return "maybe";
  return "need";
}
/* ---------- Tied a fly: take its materials off the bench ----------
   Hooks and eyes come off one per fly. Spools, packs and patches come off a share per fly
   (a thread spool lasts ~50 flies), so the count drops gradually and the low-stock warning still works.
   Changing an amount in the review sheet remembers it for that material. */
const USE_PER_FLY = {hook:1, eyes:1, thread:.02, hair:.05, feather:.1, fur:.1, flash:.03, synthetic:.05, body:.07, dubbing:.03, foam:.05, legs:.03, yarn:.05, wire:.02, glue:.01, tool:0, other:.05};
const fmtQty = q => { q=Number(q)||0; return Number.isInteger(q) ? String(q) : (q < 10 ? q.toFixed(2) : q.toFixed(1)).replace(/\.?0+$/,""); };
function benchItemFor(fm){
  const stocked = S.inventory.filter(i => Number(i.quantity) > 0);
  if(fm.material_id){ const i=stocked.find(i=>i.material_id===fm.material_id); if(i) return {i, exact:true}; }
  const w = words(fm.material_text);
  const hit = stocked.find(i => words(`${i.material.name} ${i.material.brand||""}`).some(x=>w.includes(x)));
  if(hit) return {i:hit, exact:true};
  const cat = fm.category && stocked.find(i => i.material.category === fm.category);
  return cat ? {i:cat, exact:false} : null;
}
// The tyer's own per-fly amount is saved on their bench item (inventory.use_per_fly), so it follows their account.

function perFly(i){
  if(i.use_per_fly != null) return Number(i.use_per_fly);
  let o={}; try{ o=JSON.parse(localStorage.getItem("fb_use")||"{}"); }catch{}
  if(o[i.material_id] != null){ savePerFly(i, Number(o[i.material_id])); return Number(o[i.material_id]); }
  return USE_PER_FLY[i.material.category] ?? .05;
}
async function savePerFly(i,v){
  i.use_per_fly=v;
  const { error } = await sb.from("inventory").update({ use_per_fly:v }).eq("id", i.id);
  if(!error){ try{ const o=JSON.parse(localStorage.getItem("fb_use")||"{}"); if(i.material_id in o){ delete o[i.material_id]; localStorage.setItem("fb_use",JSON.stringify(o)); } }catch{} }
}
function useMaterials(f, count=1){
  if(!requireUser()) return;
  if(!S.inventory.length){ toast("Add materials to your bench first, then Fly Bench can keep count."); return; }
  const mats=[...(f.fly_materials||[])].sort((a,b)=>a.sort-b.sort);

  if(!rows.length){ toast("None of this fly's materials are on your bench."); return; }
  let n=count;
  const s=sheet(`<h2>Take it off your bench</h2><p class="small muted" style="margin:4px 0 12px">Hooks and eyes come off one per fly. Spools and packs come off a little at a time, so your counts drop as you tie and low-stock warnings still work.</p>
    <div class="row" style="align-items:center;gap:12px;margin-bottom:8px"><b class="grow">How many ${esc(f.name)} did you tie?</b><div class="qty"><button type="button" id="uDec" aria-label="Fewer">−</button><b id="uN">${n}</b><button type="button" id="uInc" aria-label="More">+</button></div></div>
    <div id="uRows"></div>
    <button class="btn" style="width:100%;margin-top:12px" id="uGo">Update my bench</button>
    <button class="btn ghost" style="width:100%;margin-top:6px" id="uNo">Not now</button>`);
  const unitWord = c => c==="hook" ? "hook" : c==="eyes" ? "pair" : ["thread","wire"].includes(c) ? "of a spool" : c==="glue" ? "of a bottle" : c==="hair" ? "of a patch" : "of a pack";
  const draw=()=>{ $("#uN",s).textContent=n;
    $("#uRows",s).innerHTML=rows.map((r,k)=>{ const take=Math.min(Number(r.i.quantity), +(r.pf*n).toFixed(3)), left=Number(r.i.quantity)-take;
      return `<div class="urow"><label class="ucheck"><input type="checkbox" data-k="${k}" ${r.on?"checked":""}><span><b>${esc(r.i.material.name)}</b><span class="small muted">${r.exact?"":" · something similar to "+esc(r.m.material_text)}</span><br><span class="small muted">${fmtQty(r.i.quantity)} → <b class="${left<=Number(r.i.low_stock_at??0)?"need":""}">${fmtQty(left)}</b></span></span></label>
        <label class="small muted uper">per fly <input type="number" min="0" step="${["hook","eyes"].includes(r.i.material.category)?1:.01}" value="${r.pf}" data-pf="${k}"> ${unitWord(r.i.material.category)}</label></div>`; }).join("");
    $("#uRows",s).querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{ rows[+c.dataset.k].on=c.checked; });
    $("#uRows",s).querySelectorAll("[data-pf]").forEach(inp=>inp.onchange=()=>{ const r=rows[+inp.dataset.pf]; r.pf=Math.max(0,Number(inp.value)||0); r.changed=true; draw(); }); };
  draw();
  $("#uDec",s).onclick=()=>{ if(n>1){ n--; draw(); } };
  $("#uInc",s).onclick=()=>{ n++; draw(); };
  $("#uNo",s).onclick=()=>s.remove();
  $("#uGo",s).onclick=async()=>{ const b=$("#uGo",s); b.disabled=true; b.textContent="Updating…";
    let low=0;
    for(const r of rows){ if(r.changed) await savePerFly(r.i, r.pf); if(!r.on) continue;
      const q=Number(r.i.quantity), take=Math.min(q, +(r.pf*n).toFixed(3)); if(take<=0) continue;
      const nq=+(q-take).toFixed(3);
      const { error } = await sb.from("inventory").update({ quantity:nq }).eq("id", r.i.id);
      if(error){ toast("Couldn't update your bench. Please try again."); b.disabled=false; b.textContent="Update my bench"; return; }
      await sb.from("inventory_events").insert({ material_id:r.i.material_id, delta:-take, source:"use" });
      r.i.quantity=nq; if(nq<=Number(r.i.low_stock_at??0)) low++; }
    s.remove(); await loadInventory();
    toast(low ? `Bench updated. ${low} ${low===1?"item is":"items are"} running low: see Materials › Low / out.` : "Bench updated.", 4000);
    if(S.tab==="inventory") renderInventory(); };
}

async function toggleFav(id){
  const on = !S.favs.has(id);
  on ? S.favs.add(id) : S.favs.delete(id);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{ b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); b.title = on ? "Remove from favorites" : "Add to favorites"; const t=b.querySelector(".favt"); if(t) t.textContent = on ? "Saved" : "Save"; });

  if(!S.user){ lsSet("fb_favs", [...S.favs]); toast(on ? "Saved to favorites on this device. Sign in to keep them on every device." : "Removed from favorites"); return; }
  const q = on ? sb.from("fly_favorites").insert({ fly_id:id }) : sb.from("fly_favorites").delete().eq("fly_id", id);
  const { error } = await q;
  if(error){ on ? S.favs.delete(id) : S.favs.add(id); toast("Couldn't update favorites. Try again."); }

      <ol class="steps">${steps.map(st=>`<li>${esc(st.instruction)}${st.photo_path?`<img loading="lazy" src="${flyPhotoUrl(st.photo_path)}" alt="Step ${st.step_no}">`:""}${st.youtube_url?(f.creator_name?`<a class="small" style="display:block;margin-top:6px" href="${esc(ytWatchUrl(st.youtube_url))}" target="_blank" rel="noopener">▶ Watch this step on YouTube</a>`:ytEmbed(st.youtube_url)):""}</li>`).join("") || `<li class="muted">No steps yet.</li>`}</ol>
    </div>
    ${(f.tutorial_links||[]).length?`<div class="card"><h3>Watch it tied</h3>${f.tutorial_links.map(l=>`<p style="margin:8px 0 0"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)} ↗</a></p>`).join("")}</div>`:""}
    ${!f.is_starter && !mine ? `<div class="row" style="margin-bottom:10px"><button class="btn sm ghost" id="repF">⚑ Report this recipe</button><span class="grow"></span>${f.author_id?`<button class="btn sm ghost" id="hideF">Hide this member's recipes</button>`:""}</div>`:""}
    <button class="btn alt" style="width:100%" id="closeF">Close</button>`);
  $("#closeF",s).onclick=()=>s.remove();
  if($("#tieF",s)) $("#tieF",s).onclick=()=>tieMode(f);
  if($("#tiedF",s)) $("#tiedF",s).onclick=()=>useMaterials(f,1);
  history.replaceState(null,"",location.pathname+location.search+"#fly="+f.id);
  new MutationObserver((_,o)=>{ if(!s.isConnected){ o.disconnect(); if(location.hash==="#fly="+f.id) history.replaceState(null,"",location.pathname+location.search); } }).observe(document.body,{childList:true});
  s.querySelectorAll(".matCred").forEach(x=>x.onclick=e=>{ e.preventDefault(); showPhotoCredits(); });
  wireBuyLinks(s);
  if($("#repF",s)) $("#repF",s).onclick=async()=>{ if(!requireUser()) return;
    const reason = prompt("What's wrong with this recipe? (e.g. offensive, spam, copied without credit, unsafe)");
    if(!reason || !reason.trim()) return;
    const { error } = await sb.from("content_reports").insert({ fly_id:f.id, reason:reason.trim().slice(0,1000) });
    toast(error ? "Couldn't send the report. Please try again." : "Thanks. We'll review this recipe.", 3500); };
  if($("#hideF",s)) $("#hideF",s).onclick=async()=>{ if(!requireUser()) return;
    if(!confirm(`Hide all recipes from ${f.author?.display_name||"this member"}? You can undo this from Account.`)) return;
    const { error } = await sb.from("hidden_authors").insert({ author_id:f.author_id });
    if(error && error.code!=="23505") return toast("Couldn't hide this member.");
    s.remove(); S.flies=null; toast("Hidden"); renderFlies(); };
  if($("#editF",s)) $("#editF",s).onclick=()=>{ s.remove(); editFly(f); };
  if($("#copyNeed",s)) $("#copyNeed",s).onclick=async()=>{ const txt=`${f.name} – need:\n`+needList.map(m=>`• ${m.material_text}`).join("\n"); try{ await navigator.clipboard.writeText(txt); toast("Shopping list copied"); }catch{ sheet(`<h3>Shopping list</h3><textarea style="min-height:180px">${esc(txt)}</textarea>`); } };
}

/* ---------- Step-by-step tying mode: one big step per screen, screen stays on ---------- */
async function tieMode(f){
  const mats=[...(f.fly_materials||[])].sort((a,b)=>a.sort-b.sort), steps=[...(f.fly_steps||[])].sort((a,b)=>a.step_no-b.step_no);
  const pages=[{kind:"mats"}, ...steps.map((st,i)=>({kind:"step",st,i})), {kind:"done"}];
  let at=0, lock=null, tied=0;
  const grabLock=async()=>{ try{ lock=await navigator.wakeLock?.request("screen"); }catch{} };
  grabLock(); const onVis=()=>{ if(document.visibilityState==="visible" && o.isConnected) grabLock(); }; document.addEventListener("visibilitychange",onVis);
  const o=document.createElement("div"); o.className="tie"; document.body.appendChild(o);
  const close=()=>{ o.remove(); try{ lock?.release(); }catch{} document.removeEventListener("visibilitychange",onVis); document.removeEventListener("keydown",onKey); };
  const go=d=>{ at=Math.max(0,Math.min(pages.length-1,at+d)); draw(); navigator.vibrate?.(6); };
  const onKey=e=>{ if(e.key==="ArrowRight"||e.key===" ") go(1); else if(e.key==="ArrowLeft") go(-1); else if(e.key==="Escape") close(); };
  document.addEventListener("keydown",onKey);
  const draw=()=>{ const pg=pages[at];
    let body="";
    if(pg.kind==="mats") body=`<div class="tie-k">Before you start</div><h2>Get these on your bench</h2><ul class="tie-mats">${mats.map(m=>{ const st=matStatus(m); return `<li><label><input type="checkbox"> <span>${st?`<span class="dot ${st}"></span>`:""}<b>${esc(m.part||"")}</b>${m.part?": ":""}${esc(m.material_text)}</span></label></li>`; }).join("")}</ul>`;
    else if(pg.kind==="step"){ const st=pg.st, ph=st.photo_path?flyPhotoUrl(st.photo_path):null, ref=flyPhotoUrl(f.cover_photo_path)||commonsUrl(f.photo_url,800);
      body=`<div class="tie-k">Step ${pg.i+1} of ${steps.length}</div>${ph?`<img class="tie-img" src="${ph}" alt="">`:ref?`<figure class="tie-ref"><img src="${ref}" alt=""><figcaption>What you're tying</figcaption></figure>`:""}<p class="tie-txt">${esc(st.instruction)}</p>${st.youtube_url?`<a class="btn alt sm" href="${esc(ytWatchUrl(st.youtube_url))}" target="_blank" rel="noopener">▶ Watch this step</a>`:""}`; }
    else body=`<div class="tie-done">${FLY_ICON}</div><h2>Nice tie!</h2><p class="tie-sub">${tied+1>1?`That's ${tied+1} ${esc(f.name)}s.`:`Your ${esc(f.name)} is ready.`} ${S.user&&S.inventory.length?"Take the materials off your bench so your counts stay right.":"Snap a photo, then go catch something with it."}</p><div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap">${S.user&&S.inventory.length?`<button class="btn" id="tUse">Update my bench</button>`:""}<button class="btn alt" id="tAgain">Tie another</button><button class="btn alt" id="tLog">Log a catch</button></div>`;
    o.innerHTML=`<div class="tie-top"><button class="tie-x" aria-label="Close">✕</button><div class="tie-name">${esc(f.name)}</div><div class="tie-bar"><i style="width:${Math.round(at/(pages.length-1)*100)}%"></i></div></div>
      <div class="tie-body">${body}</div>
      <div class="tie-nav"><button class="btn alt" id="tPrev" ${at===0?"disabled":""}>‹ Back</button><button class="btn" id="tNext">${at===0?"Start ›":pg.kind==="done"?"Finish":"Next ›"}</button></div>`;
    o.querySelector(".tie-x").onclick=close;
    o.querySelector("#tPrev").onclick=()=>go(-1);
    o.querySelector("#tNext").onclick=()=> pg.kind==="done" ? close() : go(1);
    if(o.querySelector("#tLog")) o.querySelector("#tLog").onclick=()=>{ close(); document.querySelectorAll(".sheet").forEach(x=>x.remove()); setTab("log"); };
    if(o.querySelector("#tAgain")) o.querySelector("#tAgain").onclick=()=>{ tied++; at=1; draw(); };
    if(o.querySelector("#tUse")) o.querySelector("#tUse").onclick=()=>{ const n=tied+1; close(); useMaterials(f,n); };
  };
  let x0=null; o.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; },{passive:true});
  o.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>60 && !e.target.closest("input,label,a")) go(dx<0?1:-1); });
  draw();
}

/* ---------- First-run welcome (three quick screens) ---------- */
function welcome(){
  const slides=[
    { ico:`<span class="wfish">${window.FBFish?FBFish.svg("Redfish"):FLY_ICON}</span>`, h:"Pick your fish", p:"Every recipe is sorted by the fish it catches. Tap redfish, bass or bream and see the flies that work." },
    { ico:BENCH_ICON, h:"Scan your bench", p:"Scan the barcodes on your hooks, thread and hair. Fly Bench shows which flies you can tie tonight and makes a shopping list for the rest." },
    { ico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`, h:"Log what you catch", p:"Save each catch with a photo and the spot. See which flies work where, and check your state's fishing rules." }];
  let i=0; const o=document.createElement("div"); o.className="welcome"; document.body.appendChild(o);
  const done=()=>{ try{ localStorage.setItem("fb_welcomed","1"); }catch{} o.remove(); };
  const draw=()=>{ const sl=slides[i], last=i===slides.length-1;
    o.innerHTML=`<div class="wcard"><button class="wskip">Skip</button><div class="wico">${sl.ico}</div><h2>${sl.h}</h2><p>${sl.p}</p>
      <div class="wdots">${slides.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
      ${last?`<button class="btn" id="wGo" style="width:100%">${S.user?"Let's go":"Sign in free"}</button>${S.user?"":`<button class="btn ghost" id="wLater" style="width:100%;margin-top:6px">Just look around</button>`}`:`<button class="btn" id="wNext" style="width:100%">Next</button>`}</div>`;
    o.querySelector(".wskip").onclick=done;
    if(o.querySelector("#wNext")) o.querySelector("#wNext").onclick=()=>{ i++; draw(); };
    if(o.querySelector("#wGo")) o.querySelector("#wGo").onclick=()=>{ done(); if(!S.user) openAuth(); };
    if(o.querySelector("#wLater")) o.querySelector("#wLater").onclick=done; };
  let x0=null; o.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; },{passive:true});
  o.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(dx<-60 && i<slides.length-1){ i++; draw(); } else if(dx>60 && i>0){ i--; draw(); } });
  draw();
}

function editFly(f=null){
  const isNew = !f;
  f = f || { name:"", fly_type:"", water_type:"salt", hook_sizes:"", difficulty:"beginner", description:"", fishing_tips:"", tutorial_links:[], is_public:true, fly_species:[], fly_materials:[], fly_steps:[], cover_photo_path:null, youtube_url:null };
  const mats = [...(f.fly_materials||[])].sort((a,b)=>a.sort-b.sort).map(m=>({...m}));
  const steps = [...(f.fly_steps||[])].sort((a,b)=>a.step_no-b.step_no).map(st=>({...st}));
  const spSel = new Set((f.fly_species||[]).map(x=>x.species_id));
  let cover = f.cover_photo_path, coverFile=null;
  const links = (f.tutorial_links||[]).map(l=>l.url).join("\n");
  const s = sheet(`<h2>${isNew?"New recipe":"Edit recipe"}</h2>
    <label>Fly name</label><input type="text" id="eName" value="${esc(f.name)}">
    <div class="row"><div class="grow"><label>Type</label><input type="text" id="eType" placeholder="Baitfish, shrimp, crab, popper…" value="${esc(f.fly_type||"")}"></div>
      <div class="grow"><label>Water</label><select id="eWater">${["salt","fresh","both"].map(w=>`<option ${f.water_type===w?"selected":""} value="${w}">${w==="both"?"Salt + fresh":w[0].toUpperCase()+w.slice(1)}</option>`).join("")}</select></div></div>
    <div class="row"><div class="grow"><label>Hook sizes</label><input type="text" id="eHooks" value="${esc(f.hook_sizes||"")}"></div>
      <div class="grow"><label>Difficulty</label><select id="eDiff">${["beginner","intermediate","advanced"].map(d=>`<option ${f.difficulty===d?"selected":""}>${d}</option>`).join("")}</select></div></div>
    <div class="card" style="background:#fbf3e2;margin-top:12px"><p class="small" style="margin:0">A shared recipe needs a <b>photo or a YouTube video</b>, a typed <b>materials list</b> and typed <b>step-by-step instructions</b>. Each step can have its own photo or YouTube link.</p></div>
    <label>Photo of the finished fly</label><div class="photo-pick"><img id="covPrev" src="${cover?flyPhotoUrl(cover):""}" class="${cover?"":"hide"}"><input type="file" accept="image/*" id="eCover"></div>
    <label>YouTube video of the whole fly being tied (optional)</label><input type="url" id="eYt" inputmode="url" placeholder="https://youtu.be/…" value="${esc(f.youtube_url||"")}">
    <div class="yt-prev" id="eYtPrev"></div>
    <p class="small muted" style="margin:4px 0 0">Paste the link from YouTube's Share button. No photo? We'll use the video's thumbnail.</p>
    <div class="row"><div class="grow"><label>Pattern credit (designer or tyer)</label><input type="text" id="eCred" maxlength="120" placeholder="e.g. Tim Cammisa" value="${esc(f.creator_name||"")}"></div>
      <div class="grow"><label>Their channel or website</label><input type="url" id="eCredUrl" inputmode="url" placeholder="https://…" value="${esc(f.creator_url||"")}"></div></div>
    <label>Target species</label><div class="chips wrap" id="eSp" style="flex-wrap:wrap">${S.species.map(sp=>`<span class="chip ${spSel.has(sp.id)?"on":""}" data-sp="${sp.id}">${esc(sp.common_name.replace(/ \(.+\)/,""))}</span>`).join("")}</div>
    <label>Description</label><textarea id="eDesc">${esc(f.description||"")}</textarea>
    <label>How to fish it</label><textarea id="eTips">${esc(f.fishing_tips||"")}</textarea>
    <label>What it imitates (optional)</label><input id="eImit" maxlength="300" value="${esc(f.imitates||"")}" placeholder="e.g. Olive mayfly nymph">
    <label>When it hatches (optional)</label><input id="eHatch" maxlength="300" value="${esc(f.hatch||"")}" placeholder="e.g. April–June, midday">
    <div class="row" style="margin-top:14px"><h3 class="grow">Materials <span class="req">*</span></h3><button class="btn sm alt" id="addMat">+ Material</button></div>
    <div id="eMats"></div>
    <div class="row" style="margin-top:14px"><h3 class="grow">Step-by-step instructions <span class="req">*</span></h3><button class="btn sm alt" id="addStep">+ Step</button></div>
    <div id="eSteps"></div>
    <label>Other tutorial links (one per line, optional)</label><textarea id="eLinks" placeholder="https://…">${esc(links)}</textarea>
    <label class="row" style="gap:8px;color:var(--ink);font-size:.9rem"><input type="checkbox" id="ePub" ${f.is_public?"checked":""} style="width:auto"> Share with everyone</label>
    <p class="small muted">Only upload photos you took yourself, and only link videos that are public on YouTube. Credit any pattern originator in the description.</p>
    <div class="row" style="margin-top:12px"><button class="btn grow" id="eSave">Save recipe</button>${!isNew?`<button class="btn danger" id="eDel">Delete</button>`:""}</div>`);
  const drawMats = () => { $("#eMats",s).innerHTML = mats.map((m,i)=>`<div class="edit-row" data-i="${i}">
      <div class="row"><input type="text" placeholder="Part (tail, body…)" data-k="part" value="${esc(m.part||"")}" style="flex:1"><select data-k="category" style="flex:1">${CATEGORIES.map(c=>`<option value="${c}" ${m.category===c?"selected":""}>${CAT_LABEL[c]}</option>`).join("")}</select></div>
      <div class="row" style="margin-top:6px"><input type="text" placeholder="Material (e.g. Bucktail, chartreuse)" data-k="material_text" value="${esc(m.material_text||"")}"><button class="btn ghost" data-del>✕</button></div></div>`).join("") || `<p class="small muted">No materials yet.</p>`;
    $("#eMats",s).querySelectorAll(".edit-row").forEach(r=>{ const i=+r.dataset.i; r.querySelectorAll("[data-k]").forEach(inp=>inp.oninput=inp.onchange=()=>mats[i][inp.dataset.k]=inp.value); r.querySelector("[data-del]").onclick=()=>{ mats.splice(i,1); drawMats(); }; }); };
  const drawSteps = () => { $("#eSteps",s).innerHTML = steps.map((st,i)=>`<div class="edit-row" data-i="${i}">
      <div class="row"><b>${i+1}.</b><span class="grow"></span><button class="btn ghost" data-up ${i===0?"disabled":""}>↑</button><button class="btn ghost" data-del>✕</button></div>
      <textarea data-k="instruction" placeholder="What to do in this step">${esc(st.instruction||"")}</textarea>
      <div class="photo-pick" style="margin-top:6px"><img class="${st.photo_path||st._preview?"":"hide"}" src="${st._preview || (st.photo_path?flyPhotoUrl(st.photo_path):"")}"><input type="file" accept="image/*" data-photo>${st.photo_path||st._file?`<button class="btn ghost" data-mdel title="Remove photo">✕</button>`:""}</div>
      <input type="url" inputmode="url" data-yt placeholder="YouTube link for this step (optional)" value="${esc(st.youtube_url||"")}" style="margin-top:6px">
      <div class="small muted">Tip: on YouTube, tick "Start at" when you share so the link jumps to this step.</div></div>`).join("") || `<p class="small muted">No steps yet.</p>`;
    $("#eSteps",s).querySelectorAll(".edit-row").forEach(r=>{ const i=+r.dataset.i;
      r.querySelector("[data-k]").oninput=e=>steps[i].instruction=e.target.value;
      r.querySelector("[data-del]").onclick=()=>{ steps.splice(i,1); drawSteps(); };
      r.querySelector("[data-up]").onclick=()=>{ [steps[i-1],steps[i]]=[steps[i],steps[i-1]]; drawSteps(); };
      r.querySelector("[data-photo]").onchange=e=>{ const file=e.target.files[0]; if(!file) return;
        steps[i]._file=file; steps[i]._preview=URL.createObjectURL(file); drawSteps(); };
      const md=r.querySelector("[data-mdel]"); if(md) md.onclick=()=>{ Object.assign(steps[i], {_file:null,_preview:null,photo_path:null}); drawSteps(); };
      r.querySelector("[data-yt]").oninput=e=>steps[i].youtube_url=e.target.value.trim(); }); };
  drawMats(); drawSteps();
  $("#addMat",s).onclick=()=>{ mats.push({part:"",material_text:"",category:"other"}); drawMats(); };
  $("#addStep",s).onclick=()=>{ steps.push({instruction:""}); drawSteps(); };
  $("#eSp",s).querySelectorAll("[data-sp]").forEach(c=>c.onclick=()=>{ const id=+c.dataset.sp; spSel.has(id)?spSel.delete(id):spSel.add(id); c.classList.toggle("on"); });
  $("#eCover",s).onchange=e=>{ coverFile=e.target.files[0]; if(coverFile){ const p=$("#covPrev",s); p.src=URL.createObjectURL(coverFile); p.classList.remove("hide"); } };
  const ytPrev=()=>{ const u=$("#eYt",s).value.trim(), t=ytThumb(u), box=$("#eYtPrev",s);
    box.innerHTML = !u ? "" : t ? `<img src="${t}" alt=""><span class="small have">✓ YouTube video found</span>` : `<span class="small" style="color:#b3412e">That doesn't look like a YouTube link</span>`; };
  $("#eYt",s).oninput=ytPrev; ytPrev();
  if($("#eDel",s)) $("#eDel",s).onclick=async()=>{ if(!confirm("Delete this recipe?")) return; const { error } = await sb.from("flies").delete().eq("id", f.id); if(error) return toast(error.message); s.remove(); S.flies=null; toast("Deleted"); renderFlies(); };
  $("#eSave",s).onclick=async()=>{
    const name=$("#eName",s).value.trim(); if(!name) return toast("Give the fly a name");
    if(!mats.some(x=>x.material_text?.trim())) return toast("Add at least one material to the materials list", 3500);
    if(!steps.some(x=>x.instruction?.trim())) return toast("Type at least one step-by-step instruction", 3500);
    const yt=$("#eYt",s).value.trim();
    const credUrl=$("#eCredUrl",s).value.trim();
    if(credUrl && !/^https:\/\//i.test(credUrl)) return toast("The credit link must start with https://", 3500);
    if(yt && !ytParse(yt)) return toast("The full-video link isn't a YouTube link. Copy it from YouTube's Share button.", 4500);
    const badStep = steps.findIndex(x=>x.youtube_url && !ytParse(x.youtube_url));
    if(badStep>=0) return toast(`Step ${badStep+1}'s video link isn't a YouTube link`, 4000);
    if(steps.some(x=>(x._file||x.photo_path||x.youtube_url) && !x.instruction?.trim())) return toast("Every step with a photo or video needs typed instructions", 4000);
    const hasMedia = cover || coverFile || yt || steps.some(x=>x._file||x.photo_path||x.youtube_url);
    if($("#ePub",s).checked && !hasMedia) return toast("Add a photo or a YouTube link before sharing this recipe", 3500);
    const btn=$("#eSave",s); btn.disabled=true;
    const busy = t => btn.innerHTML=`<span class="spinner"></span> ${t}`;
    busy("Saving…");
    try{
      if(coverFile){ busy("Uploading photo…"); cover = await uploadPhoto("fly-photos", coverFile); }
      let n=0; const total=steps.filter(x=>x._file).length;
      for(const st of steps){ if(st._file){ n++; busy(`Uploading step photo ${n} of ${total}…`); st.photo_path = await uploadPhoto("fly-photos", st._file); st._file=null; } }
      if(!cover){ const firstPhoto = steps.find(x=>x.photo_path); if(firstPhoto) cover = firstPhoto.photo_path; }
      busy("Saving recipe…");
      const row = { name, fly_type:$("#eType",s).value.trim(), water_type:$("#eWater",s).value, hook_sizes:$("#eHooks",s).value.trim(),
        difficulty:$("#eDiff",s).value, description:$("#eDesc",s).value.trim(), fishing_tips:$("#eTips",s).value.trim(), imitates:$("#eImit",s).value.trim()||null, hatch:$("#eHatch",s).value.trim()||null,
        tutorial_links: $("#eLinks",s).value.split(/\s+/).filter(u=>/^https?:\/\//.test(u)).map(url=>({label:url.replace(/^https?:\/\/(www\.)?/,"").split("/")[0], url})),
        is_public:$("#ePub",s).checked, cover_photo_path:cover, youtube_url:yt?ytCanon(yt):null,
        creator_name:$("#eCred",s).value.trim()||null, creator_url:credUrl||null };
      let id = f.id;
      if(isNew){ const { data, error } = await sb.from("flies").insert(row).select("id").single(); if(error) throw error; id=data.id; }
      else { const { error } = await sb.from("flies").update(row).eq("id", id); if(error) throw error;
        await Promise.all([sb.from("fly_materials").delete().eq("fly_id",id), sb.from("fly_steps").delete().eq("fly_id",id), sb.from("fly_species").delete().eq("fly_id",id)]); }
      const m = mats.filter(x=>x.material_text?.trim()).map((x,i)=>({ fly_id:id, part:x.part||null, material_text:x.material_text.trim(), category:x.category||"other", material_id:x.material_id||null, sort:i+1 }));
      const st = steps.filter(x=>x.instruction?.trim()).map((x,i)=>({ fly_id:id, step_no:i+1, instruction:x.instruction.trim(), photo_path:x.photo_path||null, youtube_url:x.youtube_url?ytCanon(x.youtube_url):null }));
      const sp = [...spSel].map(species_id=>({ fly_id:id, species_id }));
      for(const [t, rows] of [["fly_materials",m],["fly_steps",st],["fly_species",sp]]) if(rows.length){ const { error } = await sb.from(t).insert(rows); if(error) throw error; }
      s.remove(); S.flies=null; toast("Recipe saved"); await renderFlies(); openFly(id);
    }catch(err){ console.error(err); toast(err.message || "Save failed", 4000); btn.disabled=false; btn.textContent="Save recipe"; }
  };
}

/* ================= INVENTORY ================= */
let invQ = "", invLowOnly = false;
async function renderInventory(){
  if(!S.user){ view.innerHTML = `<div class="card"><h2>Your tying bench</h2><p class="muted">Sign in to track your materials, scan barcodes when you buy, and see which flies you can tie right now.</p><button class="btn" id="si">Sign in</button></div>`; $("#si").onclick=openAuth; return; }
  await loadInventory();

const SHOPS = {

const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch{ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} };
const shopKey = () => SHOPS[lsGet("fb_shop","google")] ? lsGet("fb_shop","google") : "google";
const shopQuery = q => /fly|hook|thread|bucktail|dubbing|chenille|flash|marabou|eyes/i.test(q) ? q : `${q} fly tying`;

const pendingBuys = () => S.user ? lsGet("fb_pending_"+S.user.id, []) : [];
const setPending = list => S.user && lsSet("fb_pending_"+S.user.id, list);
function buyLink({ label, material_id=null, category="other" }){
  return `<a class="buy" href="${shopUrl(label)}" target="_blank" rel="noopener" data-buy="${esc(JSON.stringify({label, material_id, category}))}">🛒 Buy</a>`;

function wireBuyLinks(root){
  root.querySelectorAll("[data-buy]").forEach(a=>a.onclick=e=>{
    e.stopPropagation();
    if(!S.user) return; // link still opens; nothing to track without a bench
    const it = JSON.parse(a.dataset.buy); it.key = it.material_id ? "m"+it.material_id : "t"+it.label.toLowerCase(); it.at = Date.now();
    setPending([...pendingBuys().filter(x=>x.key!==it.key), it]);
  });
}
let pendAsked = 0;
function maybeAskPurchases(){
  if(!S.user || document.hidden || document.querySelector(".pendsheet")) return;
  const list = pendingBuys().filter(x => Date.now()-x.at > 15000);
  if(!list.length || Date.now()-pendAsked < 60000) return;
  pendAsked = Date.now(); askPurchases();
}
function askPurchases(){
  const list = pendingBuys(); if(!list.length) return toast("Nothing waiting");
  const s = sheet(`<div class="pendsheet"><h2>Did you buy these?</h2>
    <p class="small muted">Tick what you bought and how many packs or spools. They'll be added to your bench.</p>
    ${list.map((it,i)=>`<div class="edit-row row" data-i="${i}"><input type="checkbox" checked style="width:auto"><div class="grow"><b>${esc(it.label)}</b></div><input type="number" min="0.5" step="0.5" value="1" style="width:64px"></div>`).join("")}
    <button class="btn" style="width:100%;margin-top:12px" id="pAdd">Add to my bench</button>
    <div class="row" style="margin-top:8px"><button class="btn alt grow" id="pLater">Not yet</button><button class="btn ghost grow" id="pClear">Didn't buy them</button></div></div>`);
  $("#pLater",s).onclick=()=>{ s.remove(); };
  $("#pClear",s).onclick=()=>{ setPending([]); s.remove(); render(); };
  $("#pAdd",s).onclick=async()=>{
    const btn=$("#pAdd",s); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Adding…`;
    const rows=[...s.querySelectorAll("[data-i]")], keep=[], toPick=[]; let n=0;
    for(const r of rows){ const it=list[+r.dataset.i], qty=Number(r.querySelector("input[type=number]").value)||1;
      if(!r.querySelector("input[type=checkbox]").checked){ keep.push(it); continue; }
      let id = it.material_id;
      if(!id){ const { data } = await sb.from("materials").select("id").ilike("name", it.label).limit(1); id = data?.[0]?.id; }
      if(id){ try{ await adjust(id, qty, "purchase"); n++; }catch{ keep.push(it); } } else toPick.push({ ...it, qty });
    }
    setPending(keep); s.remove();
    if(n) toast(`Added ${n} to your bench`);
    // Recipe materials that aren't in the catalog yet: name them once, then add.
    const next = () => { const it = toPick.shift(); if(!it){ render(); return; }
      pickMaterial({ title:`Add "${it.label}"`, prefill:{ name:it.label, category:it.category }, onPick: async m => { await adjust(m.id, it.qty, "purchase"); toast(`Added ${m.name}`); next(); } }); };
    next();
  };
}

function pickMaterial({ title, barcode=null, prefill={}, lookup=null, onPick }){
  const found = lookup && lookup.found;
  const s=sheet(`<h2>${esc(title)}</h2>${barcode?`<p class="small muted">Barcode ${esc(barcode)} isn't in Fly Bench yet. Name it once and it's saved for everyone.</p>`:""}

      : barcode ? `<div class="card rules" style="padding:10px;margin-bottom:8px"><b>✓ Barcode read</b><div class="small muted" style="margin-top:4px">${lookup && lookup.message ? esc(lookup.message) : "This product isn't in the online barcode databases yet."} Search below in case it's already in the app, or type its name, brand and color once. Then it's recognized for everyone.</div></div>` : ""}
    <input type="search" id="mq" placeholder="Search materials already in the app…" value="${esc(prefill.name||"")}">

      <div class="row"><div class="grow"><label>Brand</label><input type="text" id="nb" value="${esc(prefill.brand||"")}" placeholder="Hareline, Wapsi…"></div><div class="grow"><label>Color</label><input type="text" id="nc" value="${esc(prefill.color||"")}"></div></div>
      <div class="row"><div class="grow"><label>Size</label><input type="text" id="ns" value="${esc(prefill.size||"")}" placeholder="#2, 3/0, medium…"></div><div class="grow"><label>Category</label><select id="ncat">${CATEGORIES.map(c=>`<option value="${c}" ${(prefill.category||"other")===c?"selected":""}>${CAT_LABEL[c]}</option>`).join("")}</select></div></div>

    if(error) return toast(error.message);
    if(barcode) await saveBarcode(barcode, m.id);

/* Unknown barcode → UPCitemdb, through the upc-lookup edge function (cached, capped at the free 100/day) */
async function lookupUPC(code){
  try{
    const run = sb.functions.invoke("upc-lookup", { body:{ barcode:code } });
    const { data, error } = await Promise.race([run, new Promise(r=>setTimeout(()=>r({ error:"timeout" }), 9000))]);
    return error ? null : data;
  }catch(e){ return null; }
}

    f.click(); };
  $("#haulSave",el).onclick=async()=>{ for(const [mid,v] of scanState.haul) await adjust(mid, v.n, "haul"); toast(`Saved ${scanState.haul.size} item(s)`); scanState.haul.clear(); drawHaul(); };
  const drawHaul=()=>{ $("#haulList",el).innerHTML=[...scanState.haul.values()].map(v=>`${esc(v.name)} ×${v.n}`).join(" · "); };
  async function handleCode(code){
    code = window.FBScan ? FBScan.normalize(code) : String(code||"").trim(); if(!code) return;
    const now=Date.now(); if(scanState.busy || (code===scanState.last && now-scanState.lastT<2500)) return;
    scanState.busy=true; scanState.last=code; scanState.lastT=now; navigator.vibrate?.(60);
    if(pairPeers.desk && $("#toDesk",el)?.checked){ // hand it to the computer, which looks it up and answers
      scanState.sentCode=code; $("#scanMsg",el).textContent=`✓ ${code} sent to your computer…`;
      const r = await pairSend("scan", { code, from:"phone" });
      if(r!=="ok"){ $("#scanMsg",el).textContent="Couldn't reach your computer — saving here instead."; } else { setTimeout(()=>{ if(scanState && scanState.sentCode===code) scanState.busy=false; }, 1500); return; }
    }
    $("#scanMsg",el).innerHTML=`✓ Read ${esc(code)}. Checking…`;
    const { data } = await sb.from("material_barcodes").select("material:materials(*)").eq("barcode", code).maybeSingle();
    const done = async m => {
      if(scanState.mode==="haul"){ const v=scanState.haul.get(m.id)||{name:m.name,n:0}; v.n++; scanState.haul.set(m.id,v); drawHaul(); $("#scanMsg",el).textContent=`Added to haul: ${m.name}`; }
      else { const q = await adjust(m.id, scanState.mode==="use"?-1:1, scanState.mode==="use"?"use":"scan"); $("#scanMsg",el).textContent=`${scanState.mode==="use"?"Used":"Added"} ${matLabel(m)} — now ${q}`; }
      scanState.busy=false;
    };
    if(data?.material) await done(data.material);
    else {
      $("#scanMsg",el).innerHTML=`<span class="spinner"></span> ✓ Read ${esc(code)}. Looking it up online…`;
      const lookup = await lookupUPC(code);
      const prefill = lookup?.found ? { name:lookup.name, brand:lookup.brand, color:lookup.color, size:lookup.size, category:lookup.category } : {};
      const s=pickMaterial({ title: lookup?.found ? "Is this it?" : "New barcode", barcode:code, prefill, lookup, onPick:done });
      s.style.zIndex=70; s.addEventListener("click",e=>{ if(e.target===s) scanState.busy=false; });
      $("#scanMsg",el).innerHTML=`✓ Read ${esc(code)}. Fill in the form to save it.`;
      s.addEventListener("click",e=>{ if(e.target===s) $("#scanMsg",el).textContent="Point the camera at the barcode on the package."; }); }
  }
  if(window.FBNative?.scan){
    // Phone app: use the phone's own barcode scanner, then show the result here.
    video.remove(); el.querySelector(".frame").remove(); el.classList.add("native");
    const go=document.createElement("button"); go.className="btn brass"; go.id="nativeScan"; go.textContent="📷 Scan a barcode";
    go.style.cssText="width:100%;margin-top:10px;padding:14px;font-size:1.05rem";
    $("#scanInfo",el).after(go);
    const nativeScan=async()=>{ try{ const c=await FBNative.scan(); if(scanState){ scanState.busy=false; handleCode(c); } }catch(e){ if(scanState) $("#scanMsg",el).textContent="Tap “Scan a barcode” when you're ready."; } };
    go.onclick=nativeScan; $("#photoCode",el).classList.add("hide");
    $("#scanMsg",el).textContent="Opening the camera…"; nativeScan(); return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} } });
    video.muted=true; video.playsInline=true; video.setAttribute("playsinline",""); video.setAttribute("muted","");
    video.srcObject=stream; try{ await video.play(); }catch(e){ /* iOS may start it on its own (autoplay); the reader waits for frames */ }
    let running=true;
    scanState.stop=()=>{ running=false; stream.getTracks().forEach(t=>t.stop()); };
    if(!window.FBScan){ $("#scanMsg",el).textContent="Barcode reader didn't load. Tap “📸 Photo” or “Type code”."; return; }
    const stopRead = FBScan.start(video, (code, err)=>{
      if(err){ $("#scanMsg",el).textContent = err.message+" You can also tap “📸 Photo”."; return; }
      if(!scanState || scanState.busy) return; handleCode(code); }, i=>{ const n=$("#scanInfo",el); if(n) n.textContent=`${i.mode} · camera ${i.size} · checked ${i.frames} frames`; });
    const prevStop = scanState.stop; scanState.stop = ()=>{ stopRead(); prevStop(); };
  }catch(err){ console.error(err); $("#scanMsg",el).textContent="Camera unavailable. Allow camera access for this site, or tap “📸 Photo” or “Type code”."; }
}

/* ---- phone ↔ computer: scan on the phone, review and type on the computer ----
   Both devices signed in to the same account join a private realtime channel (fbscan:<user id>).
   The computer ("desk") shows a QR code and a review list; the phone's scanner sends each code there,
   and the computer replies with what it found so the phone can show it. A USB/Bluetooth barcode scanner
   plugged into the computer works in the same list. */
let pairCh = null, pairRole = null, pairPeers = { desk:0, phone:0 }, pairListeners = new Set();
async function pairJoin(role){
  if(DEMO || !S.user) return null;
  if(pairCh && pairRole===role) return pairCh;
  pairLeave();
  try{ await sb.realtime.setAuth(); }catch(e){}
  pairRole = role;
  const ch = sb.channel("fbscan:"+S.user.id, { config:{ private:true, broadcast:{ self:false, ack:true }, presence:{ key: role+"-"+Math.random().toString(36).slice(2,8) } } });
  ch.on("presence", { event:"sync" }, ()=>{ const st=ch.presenceState(); pairPeers={ desk:0, phone:0 }; Object.values(st).flat().forEach(p=>{ if(p.role in pairPeers) pairPeers[p.role]++; }); pairListeners.forEach(f=>f({ type:"peers" })); });
  ch.on("broadcast", { event:"scan" }, ({ payload })=>pairListeners.forEach(f=>f({ type:"scan", ...payload })));
  ch.on("broadcast", { event:"ack" }, ({ payload })=>pairListeners.forEach(f=>f({ type:"ack", ...payload })));
  await new Promise(res=>{ const t=setTimeout(res, 6000); ch.subscribe(async st=>{ if(st==="SUBSCRIBED"){ clearTimeout(t); await ch.track({ role, at:Date.now(), device: /iPhone|iPad|Android/i.test(navigator.userAgent)?"phone":"computer" }); res(); } else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){ clearTimeout(t); res(); } }); });
  pairCh = ch; return ch;
}
function pairLeave(){ if(pairCh){ try{ sb.removeChannel(pairCh); }catch(e){} } pairCh=null; pairRole=null; pairPeers={ desk:0, phone:0 }; }
function pairSend(event, payload){ return pairCh ? pairCh.send({ type:"broadcast", event, payload }) : Promise.resolve("no-channel"); }

let qrLib = null;
function loadQR(){ return qrLib ||= new Promise((ok,no)=>{ if(window.qrcode) return ok(window.qrcode); const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"; s.onload=()=>ok(window.qrcode); s.onerror=()=>{ qrLib=null; no(); }; document.head.appendChild(s); }); }

async function openDeskScan(){
  if(!S.user) return openAuth();
  const url = location.origin + "/#phonescan";
  const s = sheet(`<h2>📱 Scan with your phone</h2>
    <div class="deskpair"><div id="qrBox" class="qrbox"><span class="spinner"></span></div>
      <div class="grow"><p class="small" style="margin-top:0">On your phone, scan this code with the camera — or open <b>${esc(location.host)}</b>, sign in as <b>${esc(S.user.email||"you")}</b>, and tap <b>📷 Scan barcode</b>. Every barcode you scan shows up here to check and edit with a keyboard.</p>
      <div id="pairSt" class="small muted">Connecting…</div></div></div>
    <div class="chips" style="margin:10px 0 6px"><span class="chip on" data-dm="add">Bought (+)</span><span class="chip" data-dm="use">Used up (−)</span><span class="chip" data-dm="review">Review first</span></div>
    <p class="small muted" id="dmHelp" style="margin:0 0 8px"></p>
    <input type="text" id="deskCode" inputmode="numeric" autocomplete="off" placeholder="USB/Bluetooth scanner or type a barcode, then Enter">
    <div id="deskList" style="margin-top:10px"></div>
    <div class="row" style="margin-top:10px"><button class="btn brass grow hide" id="deskSaveAll">Save all</button><button class="btn alt grow" id="deskDone">Done</button></div>`);
  s.classList.add("desk");
  const box = s.firstElementChild;
  const items = []; // { key, code, n, status:'checking'|'known'|'new'|'saved'|'error', material, lookup, form }
  let mode = "add", review = false;
  const help = () => { $("#dmHelp",s).textContent = review ? `Scans collect in the list below — adjust counts, fill in new items, then “Save all”.` : `Known items are ${mode==="use"?"taken off":"added to"} your bench the moment they're scanned; new ones wait below for you to name them.`; };
  help();
  s.querySelectorAll("[data-dm]").forEach(c=>c.onclick=()=>{ const v=c.dataset.dm; if(v==="review"){ review=!review; c.classList.toggle("on",review); } else { mode=v; s.querySelectorAll('[data-dm="add"],[data-dm="use"]').forEach(x=>x.classList.toggle("on",x.dataset.dm===mode)); } help(); draw(); });
  loadQR().then(q=>{ const qr=q(0,"M"); qr.addData(url); qr.make(); $("#qrBox",s).innerHTML=qr.createSvgTag({ cellSize:4, margin:2, scalable:true }); }, ()=>{ $("#qrBox",s).innerHTML=`<div class="small">${esc(url)}</div>`; });
  const status = () => { const n=pairPeers.phone; $("#pairSt",s).innerHTML = !pairCh ? `<span class="need">Couldn't connect — check your connection and reopen.</span>` : n ? `<b style="color:var(--moss,#2f7d4f)">● ${n>1?n+" phones":"Phone"} connected</b> — start scanning.` : `○ Waiting for your phone…`; };
  const listener = ev => { if(ev.type==="peers") status(); if(ev.type==="scan") addCode(ev.code, ev.from||"phone"); };
  pairListeners.add(listener);
  await pairJoin("desk"); status();
  const beep = () => { try{ const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain(); o.frequency.value=1250; g.gain.value=.06; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.09); }catch(e){} };

  async function addCode(raw, from){
    const code = window.FBScan ? FBScan.normalize(raw) : String(raw||"").trim(); if(!/^\d{6,14}$|^[A-Za-z0-9\-]{4,30}$/.test(code)) return;
    beep();
    const same = items.find(x=>x.code===code && x.status!=="saved");
    if(same){ same.n++; draw(); if(!review && same.status==="known") return applyNow(same); ack(code, same); return; }
    const it = { key:Math.random().toString(36).slice(2), code, n:1, status:"checking", from };
    items.unshift(it); draw();
    const { data } = await sb.from("material_barcodes").select("material:materials(*)").eq("barcode", code).maybeSingle();
    if(data?.material){ it.material=data.material; it.status="known"; }
    else { it.lookup = await lookupUPC(code); const L=it.lookup?.found?it.lookup:{}; it.form={ name:L.name||"", brand:L.brand||"", color:L.color||"", size:L.size||"", category:CATEGORIES.includes(L.category)?L.category:"other" }; it.status="new"; }
    draw();
    if(!review && it.status==="known") await applyNow(it); else ack(code, it);
  }
  async function applyNow(it){
    try{ const q = await adjust(it.material.id, mode==="use"?-it.n:it.n, mode==="use"?"use":"scan"); it.done=(it.done||0)+it.n; it.n=0; it.qty=q; it.status="saved"; it.status="known-applied"; draw(); ack(it.code, it); }
    catch(e){ it.status="error"; it.err=e.message; draw(); }
  }
  function ack(code, it){
    const text = it.status==="known-applied" ? `${mode==="use"?"Used":"Added"} ${matLabel(it.material)} — now ${fmtQty(it.qty)}`
      : it.status==="known" ? `${matLabel(it.material)} ×${it.n} — in the list on your computer`
      : it.status==="new" ? (it.lookup?.found ? `New: ${it.form.name} — check it on your computer` : `New barcode — name it on your computer`)
      : it.status==="saved" ? `Saved ${it.material?matLabel(it.material):""}` : "Got it";
    pairSend("ack", { code, text });
  }
  function row(it){
    const head = `<div class="small muted">${esc(it.code)}${it.from==="keyboard"?" · scanner":" · phone"}</div>`;
    if(it.status==="checking") return `<div class="card deskit">${head}<span class="spinner"></span> Looking it up…</div>`;
    if(it.status==="error") return `<div class="card deskit">${head}<span class="need">${esc(it.err||"Couldn't save")}</span></div>`;
    if(it.status==="known-applied"||it.status==="saved") return `<div class="card deskit done">${head}<b>✓ ${esc(matLabel(it.material))}</b> <span class="small muted">${it.qty!=null?"now "+fmtQty(it.qty):""}</span> <button class="btn sm alt" data-undo="${it.key}">Undo</button></div>`;
    const qty = `<label class="small" style="margin:0">Qty</label><input type="number" min="1" step="1" value="${it.n}" data-n="${it.key}" style="width:70px">`;
    if(it.status==="known") return `<div class="card deskit">${head}<div class="row"><div class="grow"><b>${esc(matLabel(it.material))}</b></div>${qty}<button class="btn sm" data-one="${it.key}">Save</button><button class="btn sm alt" data-x="${it.key}">✕</button></div></div>`;
    const f = it.form, L = it.lookup;
    return `<div class="card deskit new">${head}${L?.found?`<div class="small">Found online: <b>${esc(L.source_title||L.name)}</b> — check the details.</div>`:`<div class="small">${esc(L?.message||"Not in the barcode databases yet.")} Name it once and it's recognized for everyone.</div>`}
      <div class="row"><input data-f="name" data-k="${it.key}" value="${esc(f.name)}" placeholder="Name (Ice Dub, Bucktail…)" class="grow"><input data-f="brand" data-k="${it.key}" value="${esc(f.brand)}" placeholder="Brand" style="width:28%"></div>
      <div class="row"><input data-f="color" data-k="${it.key}" value="${esc(f.color)}" placeholder="Color" class="grow"><input data-f="size" data-k="${it.key}" value="${esc(f.size)}" placeholder="Size" style="width:22%"><select data-f="category" data-k="${it.key}" style="width:30%">${CATEGORIES.map(c=>`<option value="${c}" ${f.category===c?"selected":""}>${CAT_LABEL[c]}</option>`).join("")}</select></div>
      <div class="row">${qty}<span class="grow"></span><button class="btn sm alt" data-match="${it.key}">Already in the app?</button><button class="btn sm" data-one="${it.key}">Create & add</button><button class="btn sm alt" data-x="${it.key}">✕</button></div></div>`;
  }
  function draw(){
    const pending = items.filter(x=>x.status==="known"||x.status==="new");
    $("#deskList",s).innerHTML = items.length ? items.map(row).join("") : `<p class="small muted">Nothing scanned yet.</p>`;
    $("#deskSaveAll",s).classList.toggle("hide", pending.length<2);
    $("#deskSaveAll",s).textContent = `Save all (${pending.length})`;
  }
  async function saveOne(it){
    if(it.status==="new"){
      const f=it.form; if(!f.name.trim()){ toast("Give it a name first"); return false; }
      const { data:m, error } = await sb.from("materials").insert({ name:f.name.trim(), brand:f.brand.trim()||null, color:f.color.trim()||null, size:f.size.trim()||null, category:f.category }).select().single();
      if(error){ toast(error.message); return false; }
      await saveBarcode(it.code, m.id); it.material=m;
    }
    try{ it.qty = await adjust(it.material.id, mode==="use"?-it.n:it.n, mode==="use"?"use":"scan"); it.done=it.n; it.status="saved"; ack(it.code, it); return true; }
    catch(e){ return false; }
  }
  const find = k => items.find(x=>x.key===k);
  $("#deskList",s).addEventListener("input", e=>{ const t=e.target; if(t.dataset.n){ const it=find(t.dataset.n); if(it) it.n=Math.max(1,parseInt(t.value)||1); } if(t.dataset.f){ const it=find(t.dataset.k); if(it) it.form[t.dataset.f]=t.value; } });
  $("#deskList",s).addEventListener("change", e=>{ const t=e.target; if(t.dataset.f){ const it=find(t.dataset.k); if(it) it.form[t.dataset.f]=t.value; } });
  $("#deskList",s).addEventListener("click", async e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.x){ items.splice(items.indexOf(find(b.dataset.x)),1); draw(); }
    if(b.dataset.one){ b.disabled=true; await saveOne(find(b.dataset.one)); draw(); }
    if(b.dataset.undo){ const it=find(b.dataset.undo); if(it?.material && it.done){ try{ it.qty=await adjust(it.material.id, mode==="use"?it.done:-it.done, "undo"); toast("Undone"); items.splice(items.indexOf(it),1); draw(); }catch(e){} } }
    if(b.dataset.match){ const it=find(b.dataset.match); const p=pickMaterial({ title:"Find it in the app", barcode:it.code, prefill:{ ...it.form }, lookup:it.lookup, onPick:m=>{ it.material=m; it.status="known"; draw(); ack(it.code,it); } }); p.style.zIndex=80; }
  });
  $("#deskSaveAll",s).onclick=async()=>{ const b=$("#deskSaveAll",s); b.disabled=true; let n=0; for(const it of items.filter(x=>x.status==="known"||x.status==="new")) if(await saveOne(it)) n++; b.disabled=false; draw(); toast(`Saved ${n} item${n===1?"":"s"}`); };
  // keyboard-wedge scanners type digits fast and press Enter
  $("#deskCode",s).addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); const v=e.target.value.replace(/\s/g,""); e.target.value=""; if(v) addCode(v, "keyboard"); } });
  setTimeout(()=>$("#deskCode",s)?.focus(), 300);
  const close = () => { pairListeners.delete(listener); pairLeave(); if(S.tab==="inventory") renderInventory(); };
  $("#deskDone",s).onclick=()=>s.remove();
  new MutationObserver((_,o)=>{ if(!s.isConnected){ o.disconnect(); close(); } }).observe(document.body,{ childList:true });
  draw();
}

document.addEventListener("click", e => { if(!window.Stats) return; const b=e.target.closest("button,[id],.flycard,[data-buy],a[href*='avantlink'],a.buy"); if(!b) return;

      <h3>Invite links</h3>
      ${codes.map(c=>`<div class="row stcode"><div class="grow"><b>${esc(c.label)}</b><div class="small muted">${esc(c.kind)} · ?r=${esc(c.code)}</div></div>
        ${c.app!=="forecast"?`<button class="btn sm alt" data-copy="${FB_ORIGIN}/?r=${esc(c.code)}">Fly Bench link</button>`:""}${c.app!=="flybench"?`<button class="btn sm alt" data-copy="${FC_ORIGIN}/?r=${esc(c.code)}">Forecast link</button>`:""}
        <button class="btn sm" data-card="${esc(c.code)}">Counter card</button><button class="btn sm alt" data-delcode="${esc(c.code)}">✕</button></div>`).join("") || `<p class="small muted">Make one for each shop, club, creator or ad, so you can see which brings people who stay.</p>`}
      <div class="row" style="margin-top:10px"><input id="rcLabel" class="grow" placeholder="Who it's for — e.g. Mayport Fly Shop" maxlength="80">

function openReceipt(){
  const s=sheet(`<h2>Read a receipt</h2><p class="small muted">Snap a receipt, order email or packing slip. Claude pulls out the tying materials for you to review.</p>
    <input type="file" accept="image/*" id="rf"><div id="rres" style="margin-top:12px"></div>`);
  $("#rf",s).onchange=async e=>{
    const file=e.target.files[0]; if(!file) return;
    $("#rres",s).innerHTML=`<p><span class="spinner"></span> Reading receipt…</p>`;
    try{
      const { dataUrl } = await resizeImage(file, 2000, .85);
      const r = await callFn("receipt-read", { image:dataUrl, media_type:"image/jpeg" });
      const items = r.items||[];
      if(!items.length){ $("#rres",s).innerHTML=`<p class="muted">No tying materials found on that image.</p>`; return; }
      $("#rres",s).innerHTML = items.map((it,i)=>`<div class="edit-row row" data-i="${i}"><input type="checkbox" checked style="width:auto"><div class="grow"><b>${esc(it.name)}</b><div class="small muted">${esc([it.brand,it.color,it.size].filter(Boolean).join(" · "))}</div></div><input type="number" min="0" value="${Number(it.qty)||1}" style="width:64px"></div>`).join("")
        + `<button class="btn" style="width:100%" id="rAdd">Add checked items</button><p class="small muted">Items not already in the app will be created. You can edit details later.</p>`;
      $("#rAdd",s).onclick=async()=>{
        const btn=$("#rAdd",s); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Adding…`;
        let n=0;
        for(const row of s.querySelectorAll("[data-i]")){
          if(!row.querySelector("input[type=checkbox]").checked) continue;
          const it=items[+row.dataset.i], qty=Number(row.querySelector("input[type=number]").value)||1;
          let q = sb.from("materials").select("*").ilike("name", it.name);
          q = it.color ? q.ilike("color", it.color) : q.is("color", null);
          let { data:found } = await q.limit(1);
          let m = found?.[0];
          if(!m){ const r2 = await sb.from("materials").insert({ name:it.name, brand:it.brand||null, color:it.color||null, size:it.size||null, category:CATEGORIES.includes(it.category)?it.category:"other" }).select().single(); m=r2.data; }
          if(m){ await adjust(m.id, qty, "receipt"); n++; }
        }
        s.remove(); toast(`Added ${n} item(s)`); renderInventory(); };
    }catch(err){ $("#rres",s).innerHTML=`<p class="need">${esc(err.message)}</p>`; }
  };
}

    map = L.map("map").setView([30.33,-81.6], 10);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(map);
    const pts=[];
    S.catches.filter(c=>c.lat&&c.lng).forEach(c=>{ const sp=speciesById(c.species_id); pts.push([c.lat,c.lng]);
      L.circleMarker([c.lat,c.lng],{ radius:8, color:"#182241", fillColor:"#7b949c", fillOpacity:.9, weight:2 }).addTo(map)
       .bindPopup(`<b>${esc(sp?.common_name||c.species_other||"Fish")}</b><br>${fmtDate(c.caught_at)}${c.length_in?`<br>${c.length_in}"`:""}`); });
    if(pts.length) map.fitBounds(pts, { padding:[30,30], maxZoom:14 });
  } else {
    const flyCounts={}; S.catches.forEach(c=>{ if(c.fly_id){ const n=S.flies.find(f=>f.id===c.fly_id)?.name; if(n) flyCounts[n]=(flyCounts[n]||0)+1; } });
