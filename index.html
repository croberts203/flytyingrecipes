    const host = url.hostname.replace(/^(www\.|m\.|music\.)/,"");
    let id = null;
    if(host==="youtu.be") id = url.pathname.slice(1).split("/")[0];

async function resizeImage(file, max=1600, quality=.85){
  const img = await new Promise((res, rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const k = Math.min(1, max/Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  const blob = await new Promise(r=>c.toBlob(r, "image/jpeg", quality));
  const dataUrl = c.toDataURL("image/jpeg", quality);
  return { blob, dataUrl };
}
async function uploadPhoto(bucket, file, max=1600){

  if(error) throw error;
  return path;
}

}

async function loadBase(){
  const [{ data: sp }, { data: rg }] = await Promise.all([
    sb.from("species").select("*").order("sort_order"),
    sb.from("regulations").select("*"),
  ]);
  S.species = sp || [];
  S.regs = {}; (rg||[]).forEach(r => (S.regs[r.species_id] ||= []).push(r));
}
async function loadFlies(){
  const { data, error } = await sb.from("flies")
    .select("*, fly_species(species_id), fly_materials(*), fly_steps(*), author:profiles!flies_author_profile_fk(display_name)")
    .order("is_starter", { ascending:false }).order("name");
  if(error){ console.error(error); toast("Couldn't load flies"); S.flies=[]; return; }
  S.hidden = new Set();
  if(S.user){ const { data: h } = await sb.from("hidden_authors").select("author_id"); (h||[]).forEach(x=>S.hidden.add(x.author_id)); }
  S.flies = data.filter(f => !S.hidden.has(f.author_id));
}
async function loadInventory(){
  if(!S.user){ S.inventory=[]; return; }
  const { data, error } = await sb.from("inventory").select("*, material:materials(*)").order("updated_at", {ascending:false});
  if(error) console.error(error);
  S.inventory = data || [];
  // Bench photos are private: get short-lived links for the ones we show.
  const paths = S.inventory.map(i=>i.photo_path).filter(Boolean);
  S.benchUrls = {};
  if(paths.length){ const { data: urls } = await sb.storage.from("bench-photos").createSignedUrls(paths, 3600); (urls||[]).forEach(u=>{ if(u.signedUrl) S.benchUrls[u.path]=u.signedUrl; }); }
}
const benchPhoto = i => i.photo_path && S.benchUrls?.[i.photo_path];
async function loadCatches(){
  if(!S.user){ S.catches=[]; return; }
  const { data } = await sb.from("catches").select("*").order("caught_at", {ascending:false});
  S.catches = data || [];
  const paths = S.catches.map(c=>c.photo_path).filter(Boolean);
  if(paths.length){
    const { data: urls } = await sb.storage.from("catch-photos").createSignedUrls(paths, 3600);
    const m = {}; (urls||[]).forEach(u => m[u.path] = u.signedUrl);
    S.catches.forEach(c => c.photo_url = m[c.photo_path]);
  }
}
const speciesById = id => S.species.find(s=>s.id===id);

/* ---------------- material matching ---------------- */
const STOP = new Set("with plus and the for or optional small medium large size sizes color colour e.g. similar sparse white black tan olive pink red few strands strand pair pairs".split(" "));
const words = s => (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=4 && !STOP.has(w));
function matStatus(fm){
  if(!S.user || !S.inventory.length) return null;
  const stocked = S.inventory.filter(i => Number(i.quantity) > 0);
  if(fm.material_id && stocked.some(i=>i.material_id===fm.material_id)) return "have";
  const w = words(fm.material_text);
  const hit = stocked.find(i => { const iw = words(`${i.material.name} ${i.material.brand||""}`); return iw.some(x=>w.includes(x)); });
  if(hit) return "have";
  if(fm.category && stocked.some(i => i.material.category === fm.category)) return "maybe";
  return "need";
}
function canTie(f){ if(!S.user) return false; return (f.fly_materials||[]).every(m => matStatus(m) !== "need"); }

async function renderFlies(){

  let list = S.flies.filter(f => {
    if(F.species && !(f.fly_species||[]).some(x=>String(x.species_id)===String(F.species))) return false;
    if(F.water && !(f.water_type===F.water || f.water_type==="both")) return false;
    if(F.q && !(`${f.name} ${f.fly_type} ${f.description}`.toLowerCase().includes(F.q.toLowerCase()))) return false;

      <div class="grow"><label>Their channel or website</label><input type="url" id="eCredUrl" inputmode="url" placeholder="https://…" value="${esc(f.creator_url||"")}"></div></div>
    <label>Target species</label><div class="chips wrap" id="eSp" style="flex-wrap:wrap">${S.species.map(sp=>`<span class="chip ${spSel.has(sp.id)?"on":""}" data-sp="${sp.id}">${esc(sp.common_name.replace(/ \(.+\)/,""))}</span>`).join("")}</div>
    <label>Description</label><textarea id="eDesc">${esc(f.description||"")}</textarea>
    <label>How to fish it</label><textarea id="eTips">${esc(f.fishing_tips||"")}</textarea>
    <div class="row" style="margin-top:14px"><h3 class="grow">Materials <span class="req">*</span></h3><button class="btn sm alt" id="addMat">+ Material</button></div>
    <div id="eMats"></div>
    <div class="row" style="margin-top:14px"><h3 class="grow">Step-by-step instructions <span class="req">*</span></h3><button class="btn sm alt" id="addStep">+ Step</button></div>
    <div id="eSteps"></div>
    <label>Other tutorial links (one per line, optional)</label><textarea id="eLinks" placeholder="https://…">${esc(links)}</textarea>
    <label class="row" style="gap:8px;color:var(--ink);font-size:.9rem"><input type="checkbox" id="ePub" ${f.is_public?"checked":""} style="width:auto"> Share with everyone</label>
    <p class="small muted">Only upload photos you took yourself, and only link videos that are public on YouTube. Credit any pattern originator in the description.</p>
    <div class="row" style="margin-top:12px"><button class="btn grow" id="eSave">Save recipe</button>${!isNew?`<button class="btn danger" id="eDel">Delete</button>`:""}</div>`);
  const drawMats = () => { $("#eMats",s).innerHTML = mats.map((m,i)=>`<div class="edit-row" data-i="${i}">
      <div class="row"><input type="text" placeholder="Part (tail, body…)" data-k="part" value="${esc(m.part||"")}" style="flex:1"><select data-k="category" style="flex:1">${CATEGORIES.map(c=>`<option value="${c}" ${m.category===c?"selected":""}>${CAT_LABEL[c]}</option>`).join("")}</select></div>
      <div class="row" style="margin-top:6px"><input type="text" placeholder="Material (e.g. Bucktail, chartreuse)" data-k="material_text" value="${esc(m.material_text||"")}"><button class="btn ghost" data-del>✕</button></div></div>`).join("") || `<p class="small muted">No materials yet.</p>`;
    $("#eMats",s).querySelectorAll(".edit-row").forEach(r=>{ const i=+r.dataset.i; r.querySelectorAll("[data-k]").forEach(inp=>inp.oninput=inp.onchange=()=>mats[i][inp.dataset.k]=inp.value); r.querySelector("[data-del]").onclick=()=>{ mats.splice(i,1); drawMats(); }; }); };
  const drawSteps = () => { $("#eSteps",s).innerHTML = steps.map((st,i)=>`<div class="edit-row" data-i="${i}">
      <div class="row"><b>${i+1}.</b><span class="grow"></span><button class="btn ghost" data-up ${i===0?"disabled":""}>↑</button><button class="btn ghost" data-del>✕</button></div>
      <textarea data-k="instruction" placeholder="What to do in this step">${esc(st.instruction||"")}</textarea>
      <div class="photo-pick" style="margin-top:6px"><img class="${st.photo_path||st._preview?"":"hide"}" src="${st._preview || (st.photo_path?flyPhotoUrl(st.photo_path):"")}"><input type="file" accept="image/*" data-photo>${st.photo_path||st._file?`<button class="btn ghost" data-mdel title="Remove photo">✕</button>`:""}</div>
      <input type="url" inputmode="url" data-yt placeholder="YouTube link for this step (optional)" value="${esc(st.youtube_url||"")}" style="margin-top:6px">
      <div class="small muted">Tip: on YouTube, tick "Start at" when you share so the link jumps to this step.</div></div>`).join("") || `<p class="small muted">No steps yet.</p>`;
    $("#eSteps",s).querySelectorAll(".edit-row").forEach(r=>{ const i=+r.dataset.i;
      r.querySelector("[data-k]").oninput=e=>steps[i].instruction=e.target.value;
      r.querySelector("[data-del]").onclick=()=>{ steps.splice(i,1); drawSteps(); };
      r.querySelector("[data-up]").onclick=()=>{ [steps[i-1],steps[i]]=[steps[i],steps[i-1]]; drawSteps(); };
      r.querySelector("[data-photo]").onchange=e=>{ const file=e.target.files[0]; if(!file) return;
        steps[i]._file=file; steps[i]._preview=URL.createObjectURL(file); drawSteps(); };
      const md=r.querySelector("[data-mdel]"); if(md) md.onclick=()=>{ Object.assign(steps[i], {_file:null,_preview:null,photo_path:null}); drawSteps(); };
      r.querySelector("[data-yt]").oninput=e=>steps[i].youtube_url=e.target.value.trim(); }); };
  drawMats(); drawSteps();
  $("#addMat",s).onclick=()=>{ mats.push({part:"",material_text:"",category:"other"}); drawMats(); };
  $("#addStep",s).onclick=()=>{ steps.push({instruction:""}); drawSteps(); };
  $("#eSp",s).querySelectorAll("[data-sp]").forEach(c=>c.onclick=()=>{ const id=+c.dataset.sp; spSel.has(id)?spSel.delete(id):spSel.add(id); c.classList.toggle("on"); });
  $("#eCover",s).onchange=e=>{ coverFile=e.target.files[0]; if(coverFile){ const p=$("#covPrev",s); p.src=URL.createObjectURL(coverFile); p.classList.remove("hide"); } };
  const ytPrev=()=>{ const u=$("#eYt",s).value.trim(), t=ytThumb(u), box=$("#eYtPrev",s);
    box.innerHTML = !u ? "" : t ? `<img src="${t}" alt=""><span class="small have">✓ YouTube video found</span>` : `<span class="small" style="color:#b3412e">That doesn't look like a YouTube link</span>`; };
  $("#eYt",s).oninput=ytPrev; ytPrev();
  if($("#eDel",s)) $("#eDel",s).onclick=async()=>{ if(!confirm("Delete this recipe?")) return; const { error } = await sb.from("flies").delete().eq("id", f.id); if(error) return toast(error.message); s.remove(); S.flies=null; toast("Deleted"); renderFlies(); };
  $("#eSave",s).onclick=async()=>{
    const name=$("#eName",s).value.trim(); if(!name) return toast("Give the fly a name");
    if(!mats.some(x=>x.material_text?.trim())) return toast("Add at least one material to the materials list", 3500);
    if(!steps.some(x=>x.instruction?.trim())) return toast("Type at least one step-by-step instruction", 3500);
    const yt=$("#eYt",s).value.trim();
    const credUrl=$("#eCredUrl",s).value.trim();
    if(credUrl && !/^https:\/\//i.test(credUrl)) return toast("The credit link must start with https://", 3500);
    if(yt && !ytParse(yt)) return toast("The full-video link isn't a YouTube link. Copy it from YouTube's Share button.", 4500);
    const badStep = steps.findIndex(x=>x.youtube_url && !ytParse(x.youtube_url));
    if(badStep>=0) return toast(`Step ${badStep+1}'s video link isn't a YouTube link`, 4000);
    if(steps.some(x=>(x._file||x.photo_path||x.youtube_url) && !x.instruction?.trim())) return toast("Every step with a photo or video needs typed instructions", 4000);
    const hasMedia = cover || coverFile || yt || steps.some(x=>x._file||x.photo_path||x.youtube_url);
    if($("#ePub",s).checked && !hasMedia) return toast("Add a photo or a YouTube link before sharing this recipe", 3500);
    const btn=$("#eSave",s); btn.disabled=true;
    const busy = t => btn.innerHTML=`<span class="spinner"></span> ${t}`;
    busy("Saving…");
    try{
      if(coverFile){ busy("Uploading photo…"); cover = await uploadPhoto("fly-photos", coverFile); }
      let n=0; const total=steps.filter(x=>x._file).length;
      for(const st of steps){ if(st._file){ n++; busy(`Uploading step photo ${n} of ${total}…`); st.photo_path = await uploadPhoto("fly-photos", st._file); st._file=null; } }
      if(!cover){ const firstPhoto = steps.find(x=>x.photo_path); if(firstPhoto) cover = firstPhoto.photo_path; }
      busy("Saving recipe…");
      const row = { name, fly_type:$("#eType",s).value.trim(), water_type:$("#eWater",s).value, hook_sizes:$("#eHooks",s).value.trim(),
        difficulty:$("#eDiff",s).value, description:$("#eDesc",s).value.trim(), fishing_tips:$("#eTips",s).value.trim(),
        tutorial_links: $("#eLinks",s).value.split(/\s+/).filter(u=>/^https?:\/\//.test(u)).map(url=>({label:url.replace(/^https?:\/\/(www\.)?/,"").split("/")[0], url})),
        is_public:$("#ePub",s).checked, cover_photo_path:cover, youtube_url:yt?ytCanon(yt):null,
        creator_name:$("#eCred",s).value.trim()||null, creator_url:credUrl||null };
      let id = f.id;
      if(isNew){ const { data, error } = await sb.from("flies").insert(row).select("id").single(); if(error) throw error; id=data.id; }
      else { const { error } = await sb.from("flies").update(row).eq("id", id); if(error) throw error;
        await Promise.all([sb.from("fly_materials").delete().eq("fly_id",id), sb.from("fly_steps").delete().eq("fly_id",id), sb.from("fly_species").delete().eq("fly_id",id)]); }
      const m = mats.filter(x=>x.material_text?.trim()).map((x,i)=>({ fly_id:id, part:x.part||null, material_text:x.material_text.trim(), category:x.category||"other", material_id:x.material_id||null, sort:i+1 }));
      const st = steps.filter(x=>x.instruction?.trim()).map((x,i)=>({ fly_id:id, step_no:i+1, instruction:x.instruction.trim(), photo_path:x.photo_path||null, youtube_url:x.youtube_url?ytCanon(x.youtube_url):null }));
      const sp = [...spSel].map(species_id=>({ fly_id:id, species_id }));
      for(const [t, rows] of [["fly_materials",m],["fly_steps",st],["fly_species",sp]]) if(rows.length){ const { error } = await sb.from(t).insert(rows); if(error) throw error; }
      s.remove(); S.flies=null; toast("Recipe saved"); await renderFlies(); openFly(id);
    }catch(err){ console.error(err); toast(err.message || "Save failed", 4000); btn.disabled=false; btn.textContent="Save recipe"; }
  };
}

/* ================= INVENTORY ================= */
let invQ = "", invLowOnly = false;
async function renderInventory(){
  if(!S.user){ view.innerHTML = `<div class="card"><h2>Your tying bench</h2><p class="muted">Sign in to track your materials, scan barcodes when you buy, and see which flies you can tie right now.</p><button class="btn" id="si">Sign in</button></div>`; $("#si").onclick=openAuth; return; }
  await loadInventory();
  const low = S.inventory.filter(i => Number(i.quantity) <= Number(i.low_stock_at ?? 0));
  let items = S.inventory.filter(i => !invQ || `${i.material.name} ${i.material.brand||""} ${i.material.color||""}`.toLowerCase().includes(invQ.toLowerCase()));
  if(invLowOnly) items = items.filter(i => low.includes(i));
  const groups = {}; items.forEach(i => (groups[i.material.category] ||= []).push(i));
  view.innerHTML = `
    <div class="row" style="margin-bottom:10px">
      <button class="btn brass grow" id="scanBtn">📷 Scan barcode</button>
      <button class="btn alt" id="rcptBtn">🧾 Receipt</button>
    </div>
    ${pendingBuys().length?`<div class="card row pendcard" id="pendC" style="padding:10px 12px"><span class="grow">🛒 Bought anything? ${pendingBuys().length} item${pendingBuys().length>1?"s":""} waiting to add.</span><button class="btn sm">Add to bench</button></div>`:""}
    <input type="search" id="iq" placeholder="Search your materials…" value="${esc(invQ)}">
    <div class="chips" style="margin-top:8px"><span class="chip ${!invLowOnly?"on":""}" id="allI">All (${S.inventory.length})</span><span class="chip ${invLowOnly?"on":""}" id="lowI">Low / out (${low.length})</span>${low.length?`<span class="chip" id="copyLow">Copy shopping list</span>`:""}</div>
    ${Object.keys(groups).length ? CATEGORIES.filter(c=>groups[c]).map(c=>`<h3 style="margin:14px 0 8px">${CAT_LABEL[c]}</h3>${groups[c].map(invRow).join("")}`).join("") :
      `<div class="empty">${S.inventory.length?"Nothing matches.":"No materials yet. Scan a barcode or tap + Add material."}</div>`}
    <p class="small muted" style="margin-top:16px">Pictures show the type of material, not your exact product. <a href="#" id="matCred">Photo credits</a></p>`;
  $("#matCred").onclick=e=>{ e.preventDefault(); showPhotoCredits(); };
  $("#iq").oninput=e=>{ invQ=e.target.value; clearTimeout(renderInventory.t); renderInventory.t=setTimeout(()=>renderInventory().then(()=>{const i=$("#iq"); i.focus(); i.setSelectionRange(i.value.length,i.value.length);}),300); };
  $("#allI").onclick=()=>{ invLowOnly=false; renderInventory(); };
  $("#lowI").onclick=()=>{ invLowOnly=true; renderInventory(); };
  if($("#copyLow")) $("#copyLow").onclick=async()=>{ const txt="Fly tying shopping list:\n"+low.map(i=>`• ${matLabel(i.material)}`).join("\n"); try{ await navigator.clipboard.writeText(txt); toast("Copied"); }catch{ sheet(`<textarea style="min-height:200px">${esc(txt)}</textarea>`); } };
  wireBuyLinks(view); if($("#pendC")) $("#pendC").onclick=()=>askPurchases();
  $("#scanBtn").onclick=()=>openScanner();
  $("#rcptBtn").onclick=()=>openReceipt();
  view.querySelectorAll("[data-inc]").forEach(b=>b.onclick=async e=>{ e.stopPropagation(); await adjust(+b.dataset.mat, +b.dataset.inc, "manual"); renderInventory(); });
  view.querySelectorAll("[data-inv]").forEach(r=>r.onclick=()=>editInvItem(S.inventory.find(i=>i.id===+r.dataset.inv)));
  fab("+ Add material", ()=>{ const s=pickMaterial({ title:"Add material", onPick: async m => { await adjust(m.id, 1, "manual"); toast(`Added ${m.name}`); renderInventory(); } });
    const h=s.querySelector("h2"); const b=document.createElement("button"); b.className="btn brass"; b.style.cssText="width:100%;margin:4px 0 10px"; b.textContent="📷 Scan the UPC barcode instead"; b.onclick=()=>{ s.remove(); openScanner(); }; h.after(b); });
}
const matLabel = m => [m.brand, m.name, m.color, m.size].filter(Boolean).join(" · ");

/* ---------------- weekly email sign-up (no account needed) ---------------- */
const NEWSLETTER_FN = "https://rkxzfzzjzrnkiyopbdke.supabase.co/functions/v1/newsletter";
function openSubscribe(){
  if(S.user) return openAccount();
  const s=sheet(`<h2>Get the weekly email</h2><p class="muted small">One fly tying tip, technique or pattern a week from the Fly Tying Recipes blog. Free, and you can unsubscribe any time.</p>

    try{ const r=await fetch(NEWSLETTER_FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"subscribe",email})}); const j=await r.json();
      if(!r.ok) throw new Error(j.error||"Something went wrong");

/* ---------------- buying materials ---------------- */
const SHOPS = {
  google: { name:"Google Shopping (compare stores)", url:q=>`https://www.google.com/search?tbm=shop&q=${encodeURIComponent(q)}` },
  amazon: { name:"Amazon", url:q=>`https://www.amazon.com/s?k=${encodeURIComponent(q)}` },
  ebay:   { name:"eBay", url:q=>`https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(q)}` },
};
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch{ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} };
const shopKey = () => SHOPS[lsGet("fb_shop","google")] ? lsGet("fb_shop","google") : "google";
const shopQuery = q => /fly|hook|thread|bucktail|dubbing|chenille|flash|marabou|eyes/i.test(q) ? q : `${q} fly tying`;
const shopUrl = q => SHOPS[shopKey()].url(shopQuery(String(q).replace(/\s*·\s*/g," ")));
// Things the user tapped Buy on. We can't see the store's checkout, so we ask when they come back.
const pendingBuys = () => S.user ? lsGet("fb_pending_"+S.user.id, []) : [];
const setPending = list => S.user && lsSet("fb_pending_"+S.user.id, list);
function buyLink({ label, material_id=null, category="other" }){
  return `<a class="buy" href="${shopUrl(label)}" target="_blank" rel="noopener" data-buy="${esc(JSON.stringify({label, material_id, category}))}">🛒 Buy</a>`;
}
function wireBuyLinks(root){
  root.querySelectorAll("[data-buy]").forEach(a=>a.onclick=e=>{
    e.stopPropagation();
    if(!S.user) return; // link still opens; nothing to track without a bench
    const it = JSON.parse(a.dataset.buy); it.key = it.material_id ? "m"+it.material_id : "t"+it.label.toLowerCase(); it.at = Date.now();
    setPending([...pendingBuys().filter(x=>x.key!==it.key), it]);
  });
}
let pendAsked = 0;
function maybeAskPurchases(){
  if(!S.user || document.hidden || document.querySelector(".pendsheet")) return;
  const list = pendingBuys().filter(x => Date.now()-x.at > 15000);
  if(!list.length || Date.now()-pendAsked < 60000) return;
  pendAsked = Date.now(); askPurchases();
}
function askPurchases(){
  const list = pendingBuys(); if(!list.length) return toast("Nothing waiting");
  const s = sheet(`<div class="pendsheet"><h2>Did you buy these?</h2>
    <p class="small muted">Tick what you bought and how many packs or spools. They'll be added to your bench.</p>
    ${list.map((it,i)=>`<div class="edit-row row" data-i="${i}"><input type="checkbox" checked style="width:auto"><div class="grow"><b>${esc(it.label)}</b></div><input type="number" min="0.5" step="0.5" value="1" style="width:64px"></div>`).join("")}
    <button class="btn" style="width:100%;margin-top:12px" id="pAdd">Add to my bench</button>
    <div class="row" style="margin-top:8px"><button class="btn alt grow" id="pLater">Not yet</button><button class="btn ghost grow" id="pClear">Didn't buy them</button></div></div>`);
  $("#pLater",s).onclick=()=>{ s.remove(); };
  $("#pClear",s).onclick=()=>{ setPending([]); s.remove(); render(); };
  $("#pAdd",s).onclick=async()=>{
    const btn=$("#pAdd",s); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Adding…`;
    const rows=[...s.querySelectorAll("[data-i]")], keep=[], toPick=[]; let n=0;
    for(const r of rows){ const it=list[+r.dataset.i], qty=Number(r.querySelector("input[type=number]").value)||1;
      if(!r.querySelector("input[type=checkbox]").checked){ keep.push(it); continue; }
      let id = it.material_id;
      if(!id){ const { data } = await sb.from("materials").select("id").ilike("name", it.label).limit(1); id = data?.[0]?.id; }
      if(id){ try{ await adjust(id, qty, "purchase"); n++; }catch{ keep.push(it); } } else toPick.push({ ...it, qty });
    }
    setPending(keep); s.remove();
    if(n) toast(`Added ${n} to your bench`);
    // Recipe materials that aren't in the catalog yet: name them once, then add.
    const next = () => { const it = toPick.shift(); if(!it){ render(); return; }
      pickMaterial({ title:`Add "${it.label}"`, prefill:{ name:it.label, category:it.category }, onPick: async m => { await adjust(m.id, it.qty, "purchase"); toast(`Added ${m.name}`); next(); } }); };
    next();
  };
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) setTimeout(maybeAskPurchases, 600); });
window.addEventListener("focus", ()=>setTimeout(maybeAskPurchases, 600));
function invRow(i){
  const isLow = Number(i.quantity) <= Number(i.low_stock_at ?? 0);
  const own = benchPhoto(i), ph = own || catPhotoUrl(i.material.category);
  return `<div class="card row ${isLow?"low":""}" data-inv="${i.id}" style="padding:10px 12px">
    <div class="matthumb${own?" own":""}">${ph?`<img src="${ph}" alt="" loading="lazy">`:FLY_ICON}${own?"":`<span class="addph" title="Add your photo">📷</span>`}</div>
    <div class="grow"><b>${esc(i.material.name)}</b><div class="small muted">${esc([i.material.brand,i.material.color,i.material.size].filter(Boolean).join(" · "))}${i.storage_location?` · 📍${esc(i.storage_location)}`:""}</div>${isLow?`<div class="small need">${Number(i.quantity)===0?"Out":"Low"} ${buyLink({ label:matLabel(i.material), material_id:i.material_id, category:i.material.category })}</div>`:""}</div>
    <div class="qty"><button data-inc="-1" data-mat="${i.material_id}">−</button><b>${Number(i.quantity)}</b><button data-inc="1" data-mat="${i.material_id}">+</button></div></div>`;
}
async function adjust(materialId, delta, source){
  const { data, error } = await sb.rpc("adjust_inventory", { p_material_id: materialId, p_delta: delta, p_source: source });
  if(error){ toast(error.message); throw error; }
  return data;
}

      <div><label style="margin:0">Your photo</label>

    ${mine?`<details style="margin-top:10px"><summary class="small">Edit material details (shared with everyone)</summary>

/* material picker: search shared catalog or create */
function pickMaterial({ title, barcode=null, prefill={}, onPick }){
  const s=sheet(`<h2>${esc(title)}</h2>${barcode?`<p class="small muted">Barcode ${esc(barcode)} isn't known yet. Name it once and it's saved for everyone.</p>`:""}
    <input type="search" id="mq" placeholder="Search materials already in the app…" value="${esc(prefill.name||"")}">

    <div class="card"><h3>Or create a new material</h3>

      <div class="row"><div class="grow"><label>Brand</label><input type="text" id="nb" value="${esc(prefill.brand||"")}" placeholder="Hareline, Wapsi…"></div><div class="grow"><label>Color</label><input type="text" id="nc" value="${esc(prefill.color||"")}"></div></div>
      <div class="row"><div class="grow"><label>Size</label><input type="text" id="ns" value="${esc(prefill.size||"")}" placeholder="#2, 3/0, medium…"></div><div class="grow"><label>Category</label><select id="ncat">${CATEGORIES.map(c=>`<option value="${c}" ${(prefill.category||"other")===c?"selected":""}>${CAT_LABEL[c]}</option>`).join("")}</select></div></div>
      <button class="btn" style="margin-top:12px;width:100%" id="ncreate">Create & add</button></div>`);
  const search = async () => {
    const q=$("#mq",s).value.trim();

    const { data } = await sb.from("materials").select("*").or(`name.ilike.%${q.replace(/[,%()]/g," ")}%,brand.ilike.%${q.replace(/[,%()]/g," ")}%,color.ilike.%${q.replace(/[,%()]/g," ")}%`).limit(15);
    $("#mres",s).innerHTML = (data||[]).map(m=>`<div class="card row" style="padding:10px;margin-bottom:6px;cursor:pointer" data-m='${m.id}'><div class="grow"><b>${esc(m.name)}</b><div class="small muted">${esc([m.brand,m.color,m.size,CAT_LABEL[m.category]].filter(Boolean).join(" · "))}</div></div><span class="btn sm">Pick</span></div>`).join("") || `<p class="small muted">No matches — create it below.</p>`;

  };
  $("#mq",s).oninput=()=>{ clearTimeout(s._t); s._t=setTimeout(search,250); };
  if(prefill.name) search();
  $("#ncreate",s).onclick=async()=>{
    const name=$("#nn",s).value.trim(); if(!name) return toast("Enter a name");
    const { data:m, error } = await sb.from("materials").insert({ name, brand:$("#nb",s).value.trim()||null, color:$("#nc",s).value.trim()||null, size:$("#ns",s).value.trim()||null, category:$("#ncat",s).value }).select().single();
    if(error) return toast(error.message);
    if(barcode) await saveBarcode(barcode, m.id);
    s.remove(); onPick(m); };
  return s;
}
async function saveBarcode(code, materialId){ const { error } = await sb.from("material_barcodes").insert({ barcode:code, material_id:materialId }); if(error && !/duplicate/.test(error.message)) toast(error.message); }

/* ---- barcode scanner ---- */
let scanState = null;
async function openScanner(){
  const el=document.createElement("div"); el.id="scanner";
  el.innerHTML=`<video playsinline muted autoplay></video><div class="frame"></div>
    <div class="bar"><div class="modes"><span class="chip on" data-mode="add">Bought (+1)</span><span class="chip" data-mode="use">Used up (−1)</span><span class="chip" data-mode="haul">Haul mode</span></div>
    <div id="scanMsg" class="small">Point the camera at the barcode on the package.</div>
    <div id="haulList" class="small" style="margin-top:6px"></div>
    <div class="row" style="margin-top:10px"><button class="btn alt grow" id="manualCode">Type code</button><button class="btn brass grow hide" id="haulSave">Save haul</button><button class="btn grow" id="scanDone">Done</button></div></div>`;
  document.body.appendChild(el);
  const video=$("video",el);
  scanState = { mode:"add", busy:false, last:"", lastT:0, haul:new Map(), stop:null };
  el.querySelectorAll("[data-mode]").forEach(c=>c.onclick=()=>{ scanState.mode=c.dataset.mode; el.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===c)); $("#haulSave",el).classList.toggle("hide", scanState.mode!=="haul"); });
  const close = () => { scanState?.stop?.(); el.remove(); scanState=null; if(S.tab==="inventory") renderInventory(); };
  $("#scanDone",el).onclick=close;
  $("#manualCode",el).onclick=()=>{ const c=prompt("Enter the barcode number"); if(c) handleCode(c.trim()); };
  $("#haulSave",el).onclick=async()=>{ for(const [mid,v] of scanState.haul) await adjust(mid, v.n, "haul"); toast(`Saved ${scanState.haul.size} item(s)`); scanState.haul.clear(); drawHaul(); };
  const drawHaul=()=>{ $("#haulList",el).innerHTML=[...scanState.haul.values()].map(v=>`${esc(v.name)} ×${v.n}`).join(" · "); };
  async function handleCode(code){
    const now=Date.now(); if(scanState.busy || (code===scanState.last && now-scanState.lastT<2500)) return;
    scanState.busy=true; scanState.last=code; scanState.lastT=now; navigator.vibrate?.(60);
    const { data } = await sb.from("material_barcodes").select("material:materials(*)").eq("barcode", code).maybeSingle();
    const done = async m => {
      if(scanState.mode==="haul"){ const v=scanState.haul.get(m.id)||{name:m.name,n:0}; v.n++; scanState.haul.set(m.id,v); drawHaul(); $("#scanMsg",el).textContent=`Added to haul: ${m.name}`; }
      else { const q = await adjust(m.id, scanState.mode==="use"?-1:1, scanState.mode==="use"?"use":"scan"); $("#scanMsg",el).textContent=`${scanState.mode==="use"?"Used":"Added"} ${matLabel(m)} — now ${q}`; }
      scanState.busy=false;
    };
    if(data?.material) await done(data.material);
    else { const s=pickMaterial({ title:"New barcode", barcode:code, onPick:done }); s.style.zIndex=70; s.addEventListener("click",e=>{ if(e.target===s) scanState.busy=false; }); }
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} } });
    video.srcObject=stream; await video.play();
    let running=true;
    scanState.stop=()=>{ running=false; stream.getTracks().forEach(t=>t.stop()); };
    if("BarcodeDetector" in window){
      const det = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"] });
      const tick = async()=>{ if(!running) return; try{ const r=await det.detect(video); if(r[0]) handleCode(r[0].rawValue); }catch{} setTimeout(tick, 250); };
      tick();
    } else {
      $("#scanMsg",el).textContent="Loading scanner…";
      const { BrowserMultiFormatReader } = await import("https://esm.sh/@zxing/browser@0.1.5");
      const reader = new BrowserMultiFormatReader();
      $("#scanMsg",el).textContent="Point the camera at the barcode on the package.";
      const loop = async()=>{ while(running){ try{ const r = await reader.decodeOnceFromVideoElement(video); if(r && running) handleCode(r.getText()); }catch{} await new Promise(r=>setTimeout(r,400)); } };
      loop();
    }
  }catch(err){ console.error(err); $("#scanMsg",el).textContent="Camera unavailable. Allow camera access, or tap “Type code”."; }
}

/* ---- receipt reader ---- */
function openReceipt(){
  const s=sheet(`<h2>Read a receipt</h2><p class="small muted">Snap a receipt, order email or packing slip. Claude pulls out the tying materials for you to review.</p>
    <input type="file" accept="image/*" id="rf"><div id="rres" style="margin-top:12px"></div>`);
  $("#rf",s).onchange=async e=>{
    const file=e.target.files[0]; if(!file) return;
    $("#rres",s).innerHTML=`<p><span class="spinner"></span> Reading receipt…</p>`;
    try{
      const { dataUrl } = await resizeImage(file, 2000, .85);
      const r = await callFn("receipt-read", { image:dataUrl, media_type:"image/jpeg" });
      const items = r.items||[];
      if(!items.length){ $("#rres",s).innerHTML=`<p class="muted">No tying materials found on that image.</p>`; return; }
      $("#rres",s).innerHTML = items.map((it,i)=>`<div class="edit-row row" data-i="${i}"><input type="checkbox" checked style="width:auto"><div class="grow"><b>${esc(it.name)}</b><div class="small muted">${esc([it.brand,it.color,it.size].filter(Boolean).join(" · "))}</div></div><input type="number" min="0" value="${Number(it.qty)||1}" style="width:64px"></div>`).join("")
        + `<button class="btn" style="width:100%" id="rAdd">Add checked items</button><p class="small muted">Items not already in the app will be created. You can edit details later.</p>`;
      $("#rAdd",s).onclick=async()=>{
        const btn=$("#rAdd",s); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Adding…`;
        let n=0;
        for(const row of s.querySelectorAll("[data-i]")){
          if(!row.querySelector("input[type=checkbox]").checked) continue;
          const it=items[+row.dataset.i], qty=Number(row.querySelector("input[type=number]").value)||1;
          let q = sb.from("materials").select("*").ilike("name", it.name);
          q = it.color ? q.ilike("color", it.color) : q.is("color", null);
          let { data:found } = await q.limit(1);
          let m = found?.[0];
          if(!m){ const r2 = await sb.from("materials").insert({ name:it.name, brand:it.brand||null, color:it.color||null, size:it.size||null, category:CATEGORIES.includes(it.category)?it.category:"other" }).select().single(); m=r2.data; }
          if(m){ await adjust(m.id, qty, "receipt"); n++; }
        }
        s.remove(); toast(`Added ${n} item(s)`); renderInventory(); };
    }catch(err){ $("#rres",s).innerHTML=`<p class="need">${esc(err.message)}</p>`; }
  };
}

    map = L.map("map").setView([30.33,-81.6], 10);

    const pts=[];

       .bindPopup(`<b>${esc(sp?.common_name||c.species_other||"Fish")}</b><br>${fmtDate(c.caught_at)}${c.length_in?`<br>${c.length_in}"`:""}`); });
    if(pts.length) map.fitBounds(pts, { padding:[30,30], maxZoom:14 });
  } else {
    const flyCounts={}; S.catches.forEach(c=>{ if(c.fly_id){ const n=S.flies.find(f=>f.id===c.fly_id)?.name; if(n) flyCounts[n]=(flyCounts[n]||0)+1; } });
    const bar=(obj)=>{ const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]); const max=Math.max(1,...e.map(x=>x[1])); return e.map(([k,v])=>`<div style="margin:6px 0"><div class="row small"><span class="grow">${esc(k)}</span><b>${v}</b></div><div style="height:8px;background:#e9e3d4;border-radius:4px"><div style="height:8px;width:${v/max*100}%;background:var(--teal2);border-radius:4px"></div></div></div>`).join("") || `<p class="small muted">Nothing yet.</p>`; };

    <label>Fly used</label><select id="cFly"><option value="">—</option>${(S.flies||[]).map(f=>`<option value="${f.id}" ${c.fly_id===f.id?"selected":""}>${esc(f.name)}</option>`).join("")}</select>
    <div class="row"><div class="grow"><label>Length (in)</label><input type="number" step="0.25" id="cLen" value="${c.length_in??""}"></div><div class="grow"><label>Weight (lb)</label><input type="number" step="0.1" id="cWt" value="${c.weight_lb??""}"></div></div>
    <label class="row" style="gap:8px;color:var(--ink);font-size:.9rem"><input type="checkbox" id="cKept" ${c.kept?"checked":""} style="width:auto"> I kept this fish</label>
    <label>Notes</label><textarea id="cNotes" placeholder="Tide, water temp, retrieve…">${esc(c.notes||"")}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn grow" id="cSave">Save</button>${!isNew?`<button class="btn danger" id="cDel">Delete</button>`:""}</div>`);
  const spSel=$("#cSp",s);
  const showSp=()=>{ const v=spSel.value; $("#cOther",s).classList.toggle("hide", v!=="other"); const sp=speciesById(+v);
    $("#regBox",s).innerHTML = sp ? regsHtml(sp.id, region) : ""; $("#spHelp",s).innerHTML = sp?.id_tips?`<p class="small muted" style="margin:6px 0 0">ID tip: ${esc(sp.id_tips)}</p>`:""; checkKeep(); };
  const checkKeep=()=>{ const sp=speciesById(+spSel.value); const rs=(region&&region.region_code&&region.region_code!=="US-FL")?[]:(S.regs[sp?.id]||[]); const warn=$("#keepWarn",s); warn?.remove();
    if($("#cKept",s).checked && rs.some(r=>/catch and release/i.test(r.size_limit||""))) $("#cKept",s).closest("label").insertAdjacentHTML("afterend",`<p id="keepWarn" class="small need">This species is catch-and-release only.</p>`); };
  spSel.onchange=showSp; $("#cKept",s).onchange=checkKeep; showSp();
  $("#cPhoto",s).onchange=e=>{ photoFile=e.target.files[0]; if(photoFile){ const p=$("#cPrev",s); p.src=URL.createObjectURL(photoFile); p.classList.remove("hide"); $("#cId",s).disabled=false; } };
  $("#cId",s).onclick=async()=>{
    const btn=$("#cId",s); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Identifying…`;
    try{
      let src = photoFile;
      if(!src && c.photo_url){ src = await (await fetch(c.photo_url)).blob(); }
      const { dataUrl } = await resizeImage(src, 1024, .85);
      const r = await callFn("species-id", { image:dataUrl, media_type:"image/jpeg" });
      ai = { guess:r.species, conf:r.confidence };
      const match = S.species.find(sp=>r.species && sp.common_name.toLowerCase()===r.species.toLowerCase());
      $("#aiBox",s).innerHTML = `<div class="card ai" style="margin-top:10px">
        ${r.species?`<div class="row"><div class="grow"><b>${esc(r.species)}</b> <span class="small muted">· ${esc(r.confidence)} confidence</span></div>${match||r.species?`<button class="btn sm" id="useAi">Use this</button>`:""}</div>`:`<b>No clear ID</b>`}
        ${r.reason?`<p class="small" style="margin:6px 0 0">${esc(r.reason)}</p>`:""}
        ${(r.alternatives||[]).length?`<div class="small muted" style="margin-top:6px">Could also be: ${(r.alternatives).map(a=>`<a href="#" data-alt="${esc(a)}">${esc(a)}</a>`).join(", ")}</div>`:""}
        <p class="small muted" style="margin:6px 0 0">AI suggestion — please confirm. ${r.remaining_today!=null?`${r.remaining_today} IDs left today.`:""}</p></div>`;
      const apply = name => { const m=S.species.find(sp=>sp.common_name.toLowerCase()===name.toLowerCase()); if(m){ spSel.value=m.id; } else { spSel.value="other"; $("#cOther",s).value=name; } showSp(); };
      if($("#useAi",s)) $("#useAi",s).onclick=()=>apply(r.species);
      s.querySelectorAll("[data-alt]").forEach(a=>a.onclick=e=>{ e.preventDefault(); apply(a.dataset.alt); });
    }catch(err){ $("#aiBox",s).innerHTML=`<p class="small need">${esc(err.message)}</p>`; }
    btn.disabled=false; btn.textContent="🔍 Identify species from photo";
  };
  $("#cGps",s).onclick=()=>{ $("#gpsTxt",s).innerHTML=`<span class="spinner"></span>`;
    navigator.geolocation.getCurrentPosition(async p=>{ lat=p.coords.latitude; lng=p.coords.longitude; $("#gpsTxt",s).textContent=`${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(p.coords.accuracy)} m)`;
        $("#rulesBox",s).innerHTML=`<p class="small muted" style="margin:6px 0 0"><span class="spinner"></span> Finding local fishing rules…</p>`;
        const r = await lookupRegion(lat, lng); if(r){ region = r; S.nearRegion = r; showSp(); }
        $("#rulesBox",s).innerHTML = r ? rulesLinks(r) : `<p class="small muted" style="margin:6px 0 0">Couldn't look up your state. <a href="https://www.fisheries.noaa.gov/recreational-fishing/state-recreational-fishing-websites" target="_blank" rel="noopener">State fishing websites ↗</a></p>`; },
      err=>{ $("#gpsTxt",s).textContent="Couldn't get location — allow location access"; }, { enableHighAccuracy:true, timeout:15000 }); };
  if(isNew) $("#cGps",s).click();
  if($("#cDel",s)) $("#cDel",s).onclick=async()=>{ if(!confirm("Delete this catch?")) return; await sb.from("catches").delete().eq("id",c.id); if(c.photo_path) await sb.storage.from("catch-photos").remove([c.photo_path]); s.remove(); S.catches=null; renderLog(); };
  $("#cSave",s).onclick=async()=>{
    const btn=$("#cSave",s); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Saving…`;
    try{
      let photo_path=c.photo_path||null;
      if(photoFile) photo_path = await uploadPhoto("catch-photos", photoFile);
      const v=spSel.value, spId = v && v!=="other" ? +v : null;
      const row={ caught_at:new Date($("#cWhen",s).value).toISOString(), lat, lng, location_name:$("#cLoc",s).value.trim()||null,
        region_code:region?.region_code||null, region_name:region?.region_name||null, country_code:region?.country_code||null,
        species_id:spId, species_other: v==="other" ? $("#cOther",s).value.trim()||null : null, species_confirmed: !!(spId || v==="other"),
        ai_guess:ai.guess||null, ai_confidence:ai.conf||null, length_in:$("#cLen",s).value||null, weight_lb:$("#cWt",s).value||null,
        fly_id:$("#cFly",s).value?+$("#cFly",s).value:null, kept:$("#cKept",s).checked, photo_path, notes:$("#cNotes",s).value.trim()||null };
      const r = isNew ? await sb.from("catches").insert(row) : await sb.from("catches").update(row).eq("id",c.id);
      if(r.error) throw r.error;
      s.remove(); S.catches=null; toast("Catch saved"); renderLog();
    }catch(err){ toast(err.message||"Save failed",4000); btn.disabled=false; btn.textContent="Save"; }
  };
}
function openCatch(c){
  const sp=speciesById(c.species_id), fly=S.flies?.find(f=>f.id===c.fly_id);
  const name = sp?.common_name || c.species_other || "Unknown species";
  const s=sheet(`${c.photo_url?`<img class="hero" src="${c.photo_url}">`:""}
    <h2>${esc(name)}</h2><p class="small muted">${fmtDate(c.caught_at)}${c.location_name?` · ${esc(c.location_name)}`:""}</p>
    <div class="card"><div class="small">${c.length_in?`<b>${c.length_in}"</b> · `:""}${c.weight_lb?`<b>${c.weight_lb} lb</b> · `:""}${c.kept?"Kept":"Released"}${fly?` · on <a href="#" id="toFly">${esc(fly.name)}</a>`:""}</div>
      ${c.lat?`<div class="small muted" style="margin-top:4px">📍 ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)} · <a href="https://maps.google.com/?q=${c.lat},${c.lng}" target="_blank" rel="noopener">open map</a></div>`:""}
      ${c.ai_guess?`<div class="small muted" style="margin-top:4px">AI suggested: ${esc(c.ai_guess)} (${esc(c.ai_confidence||"")})</div>`:""}
      ${c.notes?`<p class="small" style="margin:8px 0 0">${esc(c.notes)}</p>`:""}</div>
    ${rulesLinks(c)}
    ${sp?regsHtml(sp.id, c):""}
    <div class="card"><h3>Get a second opinion</h3><p class="small muted" style="margin:6px 0 8px">Post this catch to iNaturalist and their community will help confirm the species. Save the photo first, then upload it there.</p>
      <div class="row wrap">${c.photo_url?`<a class="btn sm alt" href="${c.photo_url}" target="_blank" rel="noopener" download>Save photo</a>`:""}<a class="btn sm" href="https://www.inaturalist.org/observations/upload" target="_blank" rel="noopener" id="inat">Open iNaturalist ↗</a></div></div>
    <div class="row"><button class="btn grow" id="ed">Edit</button><button class="btn alt grow" id="cl">Close</button></div>`);
  $("#ed",s).onclick=()=>{ s.remove(); editCatch(c); };
  $("#cl",s).onclick=()=>s.remove();
  $("#inat",s).onclick=()=>{ const t=`${sp?.inat_taxon_name||name}${c.lat?` @ ${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`:""}`; navigator.clipboard?.writeText(t).then(()=>toast("Species & location copied — paste into iNaturalist")).catch(()=>{}); };
  if($("#toFly",s)) $("#toFly",s).onclick=e=>{ e.preventDefault(); s.remove(); setTab("flies"); openFly(fly.id); };
}

/* ================= SPECIES / REGS ================= */
async function renderSpecies(){
  if(!S.flies) await loadFlies();
  const groups={}; S.species.forEach(sp=>(groups[sp.group_name||"Other"] ||= []).push(sp));
  const nr=S.nearRegion, notFL = nr && nr.region_code && nr.region_code!=="US-FL";
  view.innerHTML = `${nr?rulesLinks(nr,"Fishing rules where you are"):`<div class="card rules"><div class="row"><div class="grow"><b>Fishing rules near me</b><div class="small muted">Use your location to open your state's official fishing rules.</div></div><button class="btn sm" id="nrGo">📍 Find</button></div></div>`}
    <div class="card" style="background:#fbf3e2"><p class="small" style="margin:0">${notFL?`The limits below are Florida's (FWC). You're in ${esc(nr.region_name)}, so ${FBRules.links(nr).length?"use the links above":"check your state's fish and wildlife agency"} for the rules that apply to you.`:`Northeast Florida summary of FWC recreational rules, checked when the app was built. Rules change often — always confirm on the official FWC page before keeping a fish.`}</p></div>
    ${Object.entries(groups).map(([g,list])=>`<h3 style="margin:16px 0 8px">${esc(g)}</h3>${list.map(sp=>{ const r=(S.regs[sp.id]||[])[0]; const n=S.flies.filter(f=>(f.fly_species||[]).some(x=>x.species_id===sp.id)).length;
      return `<div class="card" data-sp="${sp.id}" style="cursor:pointer"><div class="row"><div class="grow"><h3>${esc(sp.common_name)}</h3><div class="small muted"><i>${esc(sp.scientific_name||"")}</i></div></div><span class="small muted">${n} flies ›</span></div>
      ${r?`<div class="small" style="margin-top:6px">${[r.size_limit,r.bag_limit,r.season].filter(Boolean).map(esc).join(" · ") || "No specific limits on file"}</div>`:""}</div>`; }).join("")}`).join("")}`;
  if($("#nrGo")) $("#nrGo").onclick=openNearbyRules;
  view.querySelectorAll("[data-sp]").forEach(el=>el.onclick=()=>{ const sp=speciesById(+el.dataset.sp);
    const s=sheet(`<h2>${esc(sp.common_name)}</h2><p class="small muted"><i>${esc(sp.scientific_name||"")}</i></p>${sp.id_tips?`<p class="small"><b>How to ID:</b> ${esc(sp.id_tips)}</p>`:""}${regsHtml(sp.id)}
      <button class="btn" style="width:100%" id="sf">See flies for ${esc(sp.common_name.replace(/ \(.+\)/,""))}</button>`);
    $("#sf",s).onclick=()=>{ s.remove(); S.flyFilter={...S.flyFilter, species:String(sp.id)}; setTab("flies"); }; });
}

/* ---------------- boot ---------------- */
sb.auth.onAuthStateChange((evt)=>{ if(evt==="SIGNED_IN"||evt==="SIGNED_OUT") afterAuth(); if(evt==="PASSWORD_RECOVERY"){ const p=prompt("Enter a new password"); if(p) sb.auth.updateUser({password:p}).then(()=>toast("Password updated")); } });
(async()=>{
  view.innerHTML=`<div class="empty"><span class="spinner"></span></div>`;
  await Promise.all([refreshUser(), loadBase()]);
  await loadInventory();
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("/sw.js").catch(()=>{});
  const wantDelete = location.hash==="#delete-account";
  if(wantDelete){ history.replaceState(null,"",location.pathname); if(S.user) openAccount(); else { S.pendingAccount=true; openAuth(); } }
  if(location.hash==="#subscribe"){ history.replaceState(null,"",location.pathname); openSubscribe(); }
  if(location.hash==="#rules"){ history.replaceState(null,"",location.pathname); openNearbyRules(); }
  const wantNew = location.hash==="#new";
  if(wantNew){ history.replaceState(null,"",location.pathname); S.tab="flies"; document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="flies")); }
  await render();
  if(wantNew){ if(S.user) editFly(); else { S.pendingNew=true; openAuth(); } }
})();
</script>
<script src="staterules.js"></script>
<script src="fishtails.js" data-where="app" data-side="left" data-bottom="78" defer></script>
</body>
